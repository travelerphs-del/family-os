<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0B0F">
<title>Health — Family OS</title>

<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="stylesheet" href="./design-tokens.css">

<!-- 외부 라이브러리 -->
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
/* ─── 공통 레이아웃 ──────────────────────────────────────────── */
body {
  padding-top: var(--safe-top);
  padding-bottom: var(--safe-bottom);
  overflow-x: hidden;
}
.app {
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 var(--s6);
}
@media (max-width: 767px) {
  .app { padding: 0 var(--s4); }
}

header.hdr {
  display: flex; align-items: center; justify-content: space-between;
  padding: var(--s6) 0;
  border-bottom: 1px solid var(--border);
  margin-bottom: var(--s5);
}
@media (max-width: 767px) {
  header.hdr { padding: var(--s4) 0; margin-bottom: var(--s4); }
}
.brand { display: flex; align-items: baseline; gap: var(--s3); }
.brand-title {
  font-family: var(--font-display); font-weight: 500;
  font-size: 24px; letter-spacing: -0.01em; color: var(--text-primary);
  display: flex; align-items: center; gap: var(--s2);
}
.brand-title::before {
  content: ''; display: inline-block;
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--acc-health);
}
.brand-sub {
  font-size: 12px; color: var(--text-quiet);
  letter-spacing: 0.05em; text-transform: uppercase;
}
@media (max-width: 480px) {
  .brand-title { font-size: 20px; }
  .brand-sub { display: none; }
}
.hdr-actions { display: flex; gap: var(--s2); align-items: center; }
.icon-btn {
  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--r-md); color: var(--text-tertiary);
  transition: all var(--t-fast);
  background: transparent; border: none; cursor: pointer;
}
.icon-btn:hover { background: var(--elevated); color: var(--text-primary); }
.last-sync {
  font-size: 11px; color: var(--text-quiet); font-family: var(--font-mono);
  padding-right: var(--s2);
}
@media (max-width: 480px) { .last-sync { display: none; } }

footer.ftr {
  padding: var(--s5) 0 var(--s8);
  border-top: 1px solid var(--border);
  font-size: 11px; color: var(--text-quiet);
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: var(--s2);
}
footer.ftr .ftr-r { font-family: var(--font-mono); }

/* ─── 공통 모달 (common.js의 settings 모달과 짝) ─────────── */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(10, 11, 15, 0.7);
  backdrop-filter: blur(8px);
  display: none; align-items: center; justify-content: center;
  z-index: 100; padding: var(--s4);
}
.modal-backdrop.open { display: flex; }
.modal {
  background: var(--surface); border: 1px solid var(--border-hi);
  border-radius: var(--r-lg); padding: var(--s6);
  width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto;
  animation: modalIn 0.3s cubic-bezier(0.32, 0.72, 0, 1);
}
@keyframes modalIn {
  from { opacity: 0; transform: scale(0.96) translateY(8px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}
.modal-title {
  font-family: var(--font-display); font-size: 20px; font-weight: 500;
  margin-bottom: var(--s2);
}
.modal-desc {
  font-size: 12px; color: var(--text-tertiary); line-height: 1.6;
  margin-bottom: var(--s5);
}
.modal-field { margin-bottom: var(--s4); }
.modal-label {
  display: flex; align-items: center; gap: var(--s2);
  font-size: 11px; color: var(--text-secondary);
  text-transform: uppercase; letter-spacing: 0.06em;
  margin-bottom: var(--s2);
}
.modal-input {
  width: 100%; background: var(--canvas);
  border: 1px solid var(--border); border-radius: var(--r-sm);
  padding: 10px 12px; font-size: 12px; color: var(--text-primary);
  font-family: var(--font-mono); transition: border-color var(--t-fast);
}
.modal-input:focus { border-color: var(--accent); outline: none; }
.modal-input::placeholder { color: var(--text-quiet); }
.modal-actions {
  display: flex; gap: var(--s2); justify-content: flex-end; margin-top: var(--s5);
}
.btn {
  padding: 10px 18px; border-radius: var(--r-sm);
  font-size: 13px; font-weight: 500;
  transition: all var(--t-fast); border: 1px solid transparent;
  background: transparent; cursor: pointer; color: inherit;
  font-family: inherit;
}
.btn-primary { background: var(--accent); color: var(--canvas); }
.btn-primary:hover { background: #F5D175; }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-ghost {
  background: transparent; color: var(--text-secondary);
  border-color: var(--border);
}
.btn-ghost:hover { border-color: var(--border-hi); color: var(--text-primary); }
.btn-danger { background: var(--loss); color: white; border: none; }
.btn-danger:hover { background: #DC2626; }

/* ─── 공통 빈 상태 ──────────────────────────────────────── */
.state-empty {
  padding: var(--s8) var(--s5);
  color: var(--text-quiet); font-size: 13px;
  display: flex; flex-direction: column; gap: var(--s2);
  align-items: center; text-align: center;
}
.state-empty .ico {
  width: 32px; height: 32px; border-radius: var(--r-md);
  background: var(--elevated);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: var(--s2); color: var(--text-tertiary);
}
.state-empty .msg { color: var(--text-tertiary); font-size: 12px; }
.state-empty button {
  font-size: 12px; color: var(--accent);
  padding: 6px 10px; border: 1px solid var(--border);
  border-radius: var(--r-sm); background: transparent;
  margin-top: var(--s2); transition: all var(--t-fast); cursor: pointer;
}
.state-empty button:hover { border-color: var(--accent); background: var(--elevated); }
.spinner {
  width: 18px; height: 18px;
  border: 2px solid var(--elevated-2);
  border-top-color: var(--accent);
  border-radius: 50%; animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.gain  { color: var(--gain); }
.loss  { color: var(--loss); }
.muted { color: var(--text-quiet); }

/* ─── [Health 고유 스타일] ─────────────────────────────────── */

/* 멤버 색 매핑 — 다크 배경에서도 보이는 톤 */
:root {
  --m-dad:  #60A5FA;   /* 차분한 블루 */
  --m-mom:  #F472B6;   /* 핑크 */
  --m-robi: #C084FC;   /* 라벤더 */
  --m-dobi: #FB923C;   /* 오렌지 */
  --m-family: var(--acc-health);

  /* status 색 */
  --st-ok:   var(--gain);
  --st-warn: var(--neutral);
  --st-bad:  var(--loss);
  --st-done: var(--acc-health);
}

/* 멤버 탭 */
.health-tabs {
  display: flex; gap: var(--s2);
  padding: var(--s2);
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-md);
  margin-bottom: var(--s5);
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.health-tabs::-webkit-scrollbar { display: none; }
.health-tab {
  padding: 8px 14px;
  border-radius: var(--r-sm);
  font-size: 13px; font-weight: 500;
  color: var(--text-tertiary);
  background: transparent; border: none;
  cursor: pointer; transition: all var(--t-fast);
  white-space: nowrap;
  display: flex; align-items: center; gap: var(--s2);
}
.health-tab:hover { color: var(--text-primary); background: var(--elevated); }
.health-tab.active {
  background: var(--elevated-2); color: var(--text-primary);
}
.health-tab .mdot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

/* 액션 바 */
.health-actionbar {
  display: flex; gap: var(--s2); align-items: center;
  margin-bottom: var(--s5);
  flex-wrap: wrap;
}
.btn-action {
  padding: 8px 14px;
  font-size: 13px; font-weight: 500;
  border-radius: var(--r-sm);
  background: var(--acc-health); color: var(--canvas);
  border: none; cursor: pointer;
  display: flex; align-items: center; gap: 6px;
  transition: all var(--t-fast);
}
.btn-action:hover { background: #6EE7B7; }
.btn-action-ghost {
  background: transparent; color: var(--text-secondary);
  border: 1px solid var(--border);
}
.btn-action-ghost:hover { border-color: var(--border-hi); color: var(--text-primary); }

/* ─── 카드 공통 ─────────────────────────────────────────── */
.h-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: var(--s5);
  margin-bottom: var(--s4);
}
.h-card-title {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: var(--s4);
  display: flex; align-items: center; justify-content: space-between;
}
.h-card-title .right {
  font-family: var(--font-mono); color: var(--text-quiet);
  text-transform: none; letter-spacing: 0; font-weight: 400;
  font-size: 11px;
}
.h-card-title .right.link {
  cursor: pointer; color: var(--acc-health);
  transition: color var(--t-fast);
}
.h-card-title .right.link:hover { color: #6EE7B7; }

/* ─── 전체뷰 그리드 ─────────────────────────────────────── */
.grid-members {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--s4);
  margin-bottom: var(--s4);
}
@media (max-width: 1023px) {
  .grid-members { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 480px) {
  .grid-members { grid-template-columns: 1fr; }
}
.grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--s4);
}
@media (max-width: 1023px) {
  .grid-2 { grid-template-columns: 1fr; }
}

/* 멤버 카드 (전체뷰) */
.member-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: var(--s4);
  cursor: pointer;
  transition: all var(--t-fast);
  position: relative;
}
.member-card:hover {
  border-color: var(--border-hi);
  transform: translateY(-2px);
}
.member-card .top {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: var(--s3);
}
.member-card .name {
  font-size: 14px; font-weight: 600; color: var(--text-primary);
  display: flex; align-items: center; gap: var(--s2);
}
.member-card .name::before {
  content: ''; width: 8px; height: 8px; border-radius: 50%;
  background: var(--mcolor, var(--acc-health));
}
.member-card .status-dot {
  width: 10px; height: 10px; border-radius: 50%;
}
.member-card .meta {
  font-size: 11px; color: var(--text-tertiary);
  font-family: var(--font-mono);
  margin-bottom: var(--s2);
}
.member-card .bmi-row {
  display: flex; gap: var(--s4);
  font-size: 12px;
}
.member-card .bmi-row .label {
  color: var(--text-quiet); margin-right: 4px;
}
.member-card .bmi-row .val {
  color: var(--text-secondary); font-family: var(--font-mono);
}
.member-card .conds {
  font-size: 11px; color: var(--text-quiet);
  margin-top: var(--s2);
  display: flex; flex-wrap: wrap; gap: 4px;
}
.cond-chip {
  font-size: 10px;
  background: var(--elevated);
  color: var(--text-tertiary);
  padding: 2px 7px;
  border-radius: var(--r-full);
}

/* ─── Task 카드 ──────────────────────────────────────── */
.task-group { margin-bottom: var(--s4); }
.task-group:last-child { margin-bottom: 0; }
.task-group-head {
  font-size: 11px; color: var(--text-secondary);
  text-transform: uppercase; letter-spacing: 0.06em;
  margin-bottom: var(--s2);
  display: flex; align-items: center; gap: var(--s2);
}
.task-group-head .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--mcolor, var(--text-tertiary));
}
.task-row {
  display: flex; align-items: center; gap: var(--s3);
  padding: 10px var(--s3);
  border-radius: var(--r-sm);
  border-left: 3px solid var(--border);
  background: var(--elevated);
  margin-bottom: 6px;
  transition: all var(--t-fast);
}
.task-row.bad   { border-left-color: var(--st-bad); }
.task-row.warn  { border-left-color: var(--st-warn); }
.task-row.done  { border-left-color: var(--st-done); opacity: 0.5; }
.task-row .check {
  width: 18px; height: 18px;
  border: 1.5px solid var(--border-hi);
  border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0;
  transition: all var(--t-fast);
  background: transparent;
}
.task-row.done .check {
  background: var(--st-done); border-color: var(--st-done);
}
.task-row .check svg { width: 12px; height: 12px; color: var(--canvas); }
.task-row .body { flex: 1; min-width: 0; }
.task-row .title {
  font-size: 13px; color: var(--text-primary);
  line-height: 1.4;
}
.task-row.done .title { text-decoration: line-through; color: var(--text-quiet); }
.task-row .meta {
  font-size: 11px; color: var(--text-quiet);
  font-family: var(--font-mono);
  margin-top: 2px;
}
.task-row.bad .meta { color: var(--st-bad); }
.task-row .del {
  font-size: 16px; color: var(--text-quiet);
  cursor: pointer; opacity: 0;
  transition: opacity var(--t-fast);
  background: transparent; border: none;
}
.task-row:hover .del { opacity: 1; }
.task-row .del:hover { color: var(--loss); }
.task-empty {
  font-size: 12px; color: var(--text-quiet);
  padding: var(--s3); text-align: center;
}

/* ─── Recent updates ─────────────────────────────────── */
.recent-item {
  display: flex; gap: var(--s3);
  padding: var(--s3) 0;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
  cursor: default;
}
.recent-item:last-child { border-bottom: none; }
.recent-item.clickable { cursor: pointer; transition: background var(--t-fast);
  margin: 0 calc(-1 * var(--s3)); padding-left: var(--s3); padding-right: var(--s3);
  border-radius: var(--r-sm);
}
.recent-item.clickable:hover { background: var(--elevated); border-bottom-color: transparent; }
.recent-item .icon {
  width: 32px; height: 32px;
  border-radius: var(--r-sm);
  background: var(--elevated);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 600;
  color: var(--text-tertiary);
  flex-shrink: 0;
  font-family: var(--font-mono);
}
.recent-item .icon.vital     { background: rgba(96,165,250,0.15);   color: #93C5FD; }
.recent-item .icon.medication { background: rgba(167,139,250,0.15); color: #C4B5FD; }
.recent-item .icon.hospital  { background: rgba(244,114,182,0.15);  color: #FBCFE8; }
.recent-item .icon.home      { background: rgba(52,211,153,0.15);   color: #6EE7B7; }
.recent-item .icon.progress  { background: rgba(192,132,252,0.15);  color: #DDD6FE; }
.recent-item .icon.bloodtest { background: rgba(239,68,68,0.15);    color: #FCA5A5; }
.recent-item .icon.imaging   { background: rgba(251,146,60,0.15);   color: #FDBA74; }
.recent-item .icon.checkup   { background: rgba(99,102,241,0.15);   color: #A5B4FC; }
.recent-item .icon.vaccination { background: rgba(34,211,238,0.15); color: #67E8F9; }
.recent-item .icon.condition { background: rgba(234,179,8,0.15);    color: #FDE047; }
.recent-item .icon.allergy   { background: rgba(248,113,113,0.15);  color: #FECACA; }
.recent-item .icon.symptom   { background: rgba(244,114,182,0.15);  color: #FBCFE8; }
.recent-item .body { flex: 1; min-width: 0; }
.recent-item .head-row {
  display: flex; align-items: center; gap: var(--s2);
  margin-bottom: 4px;
  flex-wrap: wrap;
}
.recent-item .who {
  font-size: 11px; font-weight: 600;
  padding: 2px 7px; border-radius: var(--r-full);
  background: var(--elevated-2);
  color: var(--text-tertiary);
}
.recent-item .date {
  font-size: 11px; color: var(--text-quiet); font-family: var(--font-mono);
}
.recent-item .chart-num {
  font-size: 10px; font-family: var(--font-mono);
  color: var(--text-tertiary); background: var(--elevated-2);
  padding: 1px 6px; border-radius: var(--r-sm);
}
.recent-item .title {
  font-size: 13px; color: var(--text-primary);
  line-height: 1.4;
}
.recent-item .detail {
  font-size: 12px; color: var(--text-tertiary);
  margin-top: 2px; line-height: 1.5;
}
.recent-photos {
  display: flex; gap: 6px; margin-top: var(--s2);
  flex-wrap: wrap;
}
.photo-thumb {
  width: 60px; height: 60px;
  border-radius: var(--r-sm);
  background: var(--elevated);
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  color: var(--text-tertiary);
  cursor: pointer;
  transition: all var(--t-fast);
  flex-shrink: 0;
  text-decoration: none;
}
.photo-thumb:hover {
  border-color: var(--acc-health);
  color: var(--acc-health);
  background: var(--elevated-2);
}
.photo-thumb-lg { width: 100px; height: 100px; }

/* ─── 개인뷰 ─────────────────────────────────────────── */
.person-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: var(--s5);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  margin-bottom: var(--s4);
  flex-wrap: wrap;
  gap: var(--s3);
}
.person-head .left {
  display: flex; align-items: center; gap: var(--s4);
}
.person-avatar {
  width: 56px; height: 56px;
  border-radius: var(--r-full);
  background: var(--mcolor, var(--acc-health));
  display: flex; align-items: center; justify-content: center;
  color: var(--canvas); font-weight: 600;
  font-family: var(--font-display);
  font-size: 22px;
  flex-shrink: 0;
}
.person-head .name {
  font-family: var(--font-display);
  font-size: 22px; font-weight: 500;
  color: var(--text-primary);
  margin-bottom: 4px;
}
.person-head .meta {
  font-size: 12px; color: var(--text-tertiary);
  font-family: var(--font-mono);
  display: flex; gap: var(--s3);
  flex-wrap: wrap;
}
.person-head .meta span {
  display: inline-flex; align-items: center; gap: 4px;
}
.person-head .meta .label { color: var(--text-quiet); }

.summary-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: var(--s4);
  margin-bottom: var(--s4);
}
@media (max-width: 767px) {
  .summary-grid { grid-template-columns: 1fr; }
}

.summary-card { padding: var(--s5); }
.summary-list {
  display: flex; flex-direction: column; gap: var(--s2);
  font-size: 13px;
}
.summary-list .row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
}
.summary-list .row:last-child { border-bottom: none; }
.summary-list .row .l { color: var(--text-secondary); }
.summary-list .row .r {
  color: var(--text-primary);
  font-family: var(--font-mono); font-size: 12px;
}
.summary-list .empty {
  font-size: 12px; color: var(--text-quiet); text-align: center; padding: var(--s3);
}

/* 차트 영역 */
.chart-card { padding: var(--s5); }
.chart-tabs {
  display: flex; gap: 4px;
  margin-bottom: var(--s3);
  flex-wrap: wrap;
}
.chart-tab {
  padding: 5px 10px;
  font-size: 11px; font-family: var(--font-mono);
  color: var(--text-tertiary);
  background: transparent; border: 1px solid var(--border);
  border-radius: var(--r-sm);
  cursor: pointer; transition: all var(--t-fast);
}
.chart-tab:hover { color: var(--text-primary); }
.chart-tab.active {
  background: var(--elevated); color: var(--text-primary);
  border-color: var(--border-hi);
}
.chart-wrap {
  position: relative;
  height: 220px;
  width: 100%;
}

/* ─── 카테고리 picker / 폼 모달 ───────────────────────── */
.h-modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(10, 11, 15, 0.7);
  backdrop-filter: blur(8px);
  display: none; align-items: flex-end; justify-content: center;
  z-index: 200;
}
.h-modal-backdrop.open { display: flex; }
@media (min-width: 768px) {
  .h-modal-backdrop { align-items: center; padding: var(--s4); }
}
.h-modal {
  background: var(--surface);
  border: 1px solid var(--border-hi);
  border-radius: var(--r-lg) var(--r-lg) 0 0;
  width: 100%; max-width: 560px;
  max-height: 92vh;
  display: flex; flex-direction: column;
  animation: modalSlideUp var(--t-sheet) cubic-bezier(0.32, 0.72, 0, 1);
}
@media (min-width: 768px) {
  .h-modal { border-radius: var(--r-lg); }
}
@keyframes modalSlideUp {
  from { transform: translateY(20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.h-modal-head {
  padding: var(--s4) var(--s5);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.h-modal-title {
  font-family: var(--font-display);
  font-size: 18px; font-weight: 500;
  color: var(--text-primary);
  display: flex; align-items: center; gap: var(--s2);
}
.h-modal-back {
  font-size: 13px; color: var(--text-tertiary);
  background: transparent; border: none; cursor: pointer;
  margin-right: var(--s2);
  padding: 4px;
}
.h-modal-back:hover { color: var(--text-primary); }
.h-modal-close {
  font-size: 24px; line-height: 1;
  color: var(--text-quiet);
  background: transparent; border: none; cursor: pointer;
  padding: 4px 8px;
}
.h-modal-close:hover { color: var(--text-primary); }
.h-modal-body {
  padding: var(--s5);
  overflow-y: auto;
  flex: 1;
}
.h-modal-foot {
  padding: var(--s4) var(--s5);
  border-top: 1px solid var(--border);
  display: flex; gap: var(--s2); justify-content: flex-end;
}

/* 카테고리 picker */
.cat-list {
  display: grid;
  grid-template-columns: 1fr;
  gap: 4px;
}
.cat-item {
  display: flex; align-items: center; gap: var(--s3);
  padding: var(--s3) var(--s3);
  background: transparent;
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  cursor: pointer;
  transition: all var(--t-fast);
  text-align: left;
  font-family: inherit;
}
.cat-item:hover {
  background: var(--elevated);
  border-color: var(--border-hi);
}
.cat-icon {
  width: 36px; height: 36px;
  border-radius: var(--r-sm);
  display: flex; align-items: center; justify-content: center;
  font-weight: 600; font-size: 13px;
  font-family: var(--font-mono);
  flex-shrink: 0;
  background: var(--elevated);
  color: var(--text-tertiary);
}
.cat-icon.task      { background: rgba(52,211,153,0.15); color: #6EE7B7; }
.cat-icon.vital     { background: rgba(96,165,250,0.15); color: #93C5FD; }
.cat-icon.medication { background: rgba(167,139,250,0.15); color: #C4B5FD; }
.cat-icon.hospital  { background: rgba(244,114,182,0.15); color: #FBCFE8; }
.cat-icon.home      { background: rgba(52,211,153,0.15); color: #6EE7B7; }
.cat-icon.vaccination { background: rgba(34,211,238,0.15); color: #67E8F9; }
.cat-icon.progress  { background: rgba(192,132,252,0.15); color: #DDD6FE; }
.cat-icon.condition { background: rgba(234,179,8,0.15); color: #FDE047; }
.cat-icon.allergy   { background: rgba(248,113,113,0.15); color: #FECACA; }
.cat-icon.momsnote  { background: rgba(244,114,182,0.15); color: #FBCFE8; }
.cat-meta { flex: 1; min-width: 0; }
.cat-name {
  font-size: 13px; font-weight: 500;
  color: var(--text-primary);
}
.cat-desc {
  font-size: 11px; color: var(--text-quiet);
  margin-top: 2px;
}
.cat-arrow {
  font-size: 16px; color: var(--text-quiet);
}

/* 폼 */
.form-group { margin-bottom: var(--s4); }
.form-label {
  display: block; font-size: 11px;
  color: var(--text-secondary);
  text-transform: uppercase; letter-spacing: 0.04em;
  margin-bottom: 6px;
  font-weight: 500;
}
.form-label .req { color: var(--loss); margin-left: 2px; }
.form-input, .form-select, .form-textarea {
  width: 100%;
  background: var(--canvas);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  padding: 10px 12px;
  font-size: 13px;
  color: var(--text-primary);
  font-family: inherit;
  transition: border-color var(--t-fast);
}
.form-input:focus, .form-select:focus, .form-textarea:focus {
  border-color: var(--accent); outline: none;
}
.form-textarea {
  min-height: 70px;
  resize: vertical;
  font-family: inherit;
  line-height: 1.5;
}
.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--s3);
  margin-bottom: var(--s4);
}
@media (max-width: 480px) {
  .form-row { grid-template-columns: 1fr; }
}

/* 멤버 picker (폼 안) */
.mem-picker {
  display: flex; gap: 4px;
  flex-wrap: wrap;
}
.mem-pick-btn {
  padding: 6px 12px;
  font-size: 12px;
  border-radius: var(--r-sm);
  background: var(--canvas);
  border: 1px solid var(--border);
  color: var(--text-tertiary);
  cursor: pointer;
  transition: all var(--t-fast);
  display: flex; align-items: center; gap: 6px;
  font-family: inherit;
}
.mem-pick-btn .mdot { width: 6px; height: 6px; border-radius: 50%; }
.mem-pick-btn:hover { color: var(--text-primary); }
.mem-pick-btn.active {
  background: var(--elevated);
  border-color: var(--border-hi);
  color: var(--text-primary);
}

/* Mom's Note 필드 검증 */
.mn-field {
  border: 1px solid var(--border); border-radius: var(--r-sm);
  padding: var(--s3); margin-bottom: var(--s3);
  transition: border-color var(--t-fast);
}
.mn-field.error { border-color: var(--loss); }
.mn-error-msg {
  font-size: 11px; color: var(--loss);
  margin-top: 4px; display: none;
}
.mn-field.error .mn-error-msg { display: block; }

/* 사진 업로드 */
.photo-strip {
  display: flex; gap: var(--s2);
  flex-wrap: wrap;
  margin-bottom: var(--s2);
}
.photo-preview {
  position: relative;
  width: 80px; height: 80px;
  border-radius: var(--r-sm);
  overflow: hidden;
  border: 1px solid var(--border);
}
.photo-preview img {
  width: 100%; height: 100%; object-fit: cover;
}
.photo-preview-del {
  position: absolute; top: 4px; right: 4px;
  width: 20px; height: 20px;
  border-radius: 50%;
  background: rgba(0,0,0,0.7);
  color: white; font-size: 13px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  line-height: 1;
}
.photo-input-label {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px;
  font-size: 12px;
  background: var(--elevated);
  border: 1px dashed var(--border-hi);
  border-radius: var(--r-sm);
  color: var(--text-tertiary);
  cursor: pointer;
  transition: all var(--t-fast);
}
.photo-input-label:hover {
  border-color: var(--accent); color: var(--text-primary);
}

/* ─── Toast ─────────────────────────────────────────── */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(120px);
  background: var(--surface);
  border: 1px solid var(--border-hi);
  border-radius: var(--r-sm);
  padding: 12px 18px;
  font-size: 13px;
  color: var(--text-primary);
  z-index: 300;
  display: flex; align-items: center; gap: var(--s2);
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  transition: transform var(--t-sheet) cubic-bezier(0.32, 0.72, 0, 1);
  max-width: 90vw;
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.ok    { border-left: 3px solid var(--gain); }
.toast.error { border-left: 3px solid var(--loss); }
.toast.info  { border-left: 3px solid var(--accent); }

/* ─── Home Clinic Detail Popup ─────────────────────── */
.hc-detail-section {
  margin-bottom: var(--s4);
}
.hc-detail-section h4 {
  font-size: 11px; color: var(--text-secondary);
  text-transform: uppercase; letter-spacing: 0.06em;
  margin-bottom: 6px;
  font-weight: 500;
}
.hc-detail-section .content {
  font-size: 13px; line-height: 1.6;
  color: var(--text-primary);
  white-space: pre-wrap;
}
.pn-card {
  background: var(--canvas);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  padding: var(--s3);
  margin-bottom: var(--s2);
}
.pn-card-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 6px;
}
.pn-card-head .date {
  font-size: 11px; color: var(--text-quiet);
  font-family: var(--font-mono);
}
.pn-card-head .day {
  font-size: 11px;
  background: var(--elevated);
  color: var(--text-tertiary);
  padding: 2px 8px;
  border-radius: var(--r-full);
  font-family: var(--font-mono);
}
.pn-card .pn-body {
  font-size: 12px; color: var(--text-secondary);
  line-height: 1.5;
}
.pn-card .pn-body b { color: var(--text-primary); }

/* ─── 뷰 전환 ──────────────────────────────────────── */
.view { display: none; }
.view.active { display: block; }

/* ─── 운동 스케줄 카드 ───────────────────────────── */
.sched-card { margin-bottom: var(--s5); }
.sched-section { padding: var(--s3) 0; border-bottom: 1px solid var(--border); }
.sched-section:last-child { border-bottom: none; padding-bottom: 0; }
.sched-section-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--s2); margin-bottom: var(--s3);
}
.sched-who {
  display: flex; align-items: center; gap: var(--s2);
  font-size: 13px; font-weight: 600; color: var(--text-primary);
}
.sched-who-badge {
  font-size: 11px; padding: 2px 8px; border-radius: var(--r-sm);
  font-family: var(--font-mono); letter-spacing: 0.04em;
}
.sched-who-badge.robi { background: rgba(192, 132, 252, 0.15); color: var(--m-robi); }
.sched-who-badge.dobi { background: rgba(251, 146, 60, 0.15); color: var(--m-dobi); }
.sched-empty {
  font-size: 12px; color: var(--text-quiet);
  padding: var(--s2) 0; font-style: italic;
}

/* 주간 캘린더 (weekly) */
.week-cal {
  display: grid;
  grid-template-columns: 80px repeat(7, 1fr);
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  overflow: hidden;
  font-size: 11px;
}
.week-cal-cell {
  background: var(--surface);
  padding: 6px 2px;
  text-align: center;
  color: var(--text-secondary);
  min-height: 24px;
  display: flex; align-items: center; justify-content: center;
}
.week-cal-cell.week-cal-day-header {
  background: var(--elevated);
  color: var(--text-quiet);
  font-weight: 600;
  font-family: var(--font-mono);
}
.week-cal-cell.today {
  background: var(--elevated);
  color: var(--acc-health);
  font-weight: 600;
}
.week-cal-row-label {
  background: var(--surface);
  padding: 6px 6px;
  text-align: left;
  color: var(--text-primary);
  display: flex; align-items: center; gap: 4px;
  font-size: 11px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.week-cal-row-label .sched-who-badge {
  padding: 1px 5px;
  font-size: 10px;
  flex-shrink: 0;
}
.week-cal-cell.has-event {
  background: var(--acc-health-soft);
  color: var(--acc-health);
  font-weight: 600;
}

/* 단발 일정 리스트 (oneoff) */
.sched-oneoff-list {
  display: flex; flex-direction: column; gap: 6px;
}
.sched-oneoff-item {
  display: flex; align-items: center; gap: var(--s2);
  padding: 8px 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  font-size: 12px;
  flex-wrap: wrap;
}
.sched-oneoff-item .date {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-quiet);
  min-width: 70px;
}
.sched-oneoff-item .date.today {
  color: var(--acc-health);
  font-weight: 600;
}
.sched-oneoff-item .title {
  flex: 1;
  color: var(--text-primary);
  min-width: 0;
}
.sched-oneoff-item .meta {
  font-size: 11px;
  color: var(--text-quiet);
  font-family: var(--font-mono);
  width: 100%;
  padding-left: 78px;
}
.sched-oneoff-item .meta:empty { display: none; }
.sched-oneoff-item.past {
  opacity: 0.5;
}
</style>
</head>
<body>
<div class="app">
  <div id="hdr-mount"></div>

  <!-- 멤버 탭 -->
  <nav class="health-tabs" id="member-tabs">
    <button class="health-tab active" data-view="all">전체</button>
  </nav>

  <!-- 액션 바 -->
  <div class="health-actionbar">
    <button class="btn-action" id="btn-add-record">
      <span style="font-size:16px;line-height:1">＋</span>기록 추가
    </button>
    <button class="btn-action-ghost" id="btn-export-excel">📥 Excel 내보내기</button>
  </div>

  <!-- 메인 마운트 -->
  <main id="main-mount">
    <!-- 데이터 로드 후 renderView()가 채움 -->
  </main>

  <div id="ftr-mount"></div>
</div>

<!-- Web App URL 모달 (common.js) -->
<div id="modal-mount"></div>

<!-- Health 자체 모달 (기록 추가 / 상세 보기) -->
<div class="h-modal-backdrop" id="h-modal-backdrop">
  <div class="h-modal" id="h-modal">
    <div class="h-modal-head">
      <div class="h-modal-title">
        <button class="h-modal-back" id="h-modal-back" style="display:none">←</button>
        <span id="h-modal-title">기록 추가</span>
      </div>
      <button class="h-modal-close" id="h-modal-close">×</button>
    </div>
    <div class="h-modal-body" id="h-modal-body"></div>
    <div class="h-modal-foot" id="h-modal-foot" style="display:none">
      <button class="btn btn-ghost" id="h-modal-cancel">취소</button>
      <button class="btn btn-primary" id="h-modal-submit">저장</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast">
  <span id="toast-msg"></span>
</div>

<!-- 공통 모듈 -->
<script src="./common.js"></script>

<script>
/* ════════════════════════════════════════════════════════════
 * Health Dashboard — 클라이언트 로직
 * ════════════════════════════════════════════════════════════ */

const DASHBOARD_ID = 'health';
const meta = FamilyOS.getDashboardMeta(DASHBOARD_ID);

/* ─── 상태 ───────────────────────────────────────── */
const state = {
  sheets: {},      // mode=full 응답의 sheets 객체
  members: [],     // 멤버 마스터 (sheets.members 캐싱)
  currentView: 'all', // 'all' | 'dad' | 'mom' | 'robi' | 'dobi'
  currentChartItem: 'AST',
  currentVitalItem: 'weight',
  charts: {},
  isSubmitting: false,
  pendingPhotos: [],
  currentCategory: null,
};

const MEMBER_ORDER = ['dad', 'mom', 'robi', 'dobi'];
const MEMBER_LABELS = { dad: '아빠', mom: '엄마', robi: '로비', dobi: '도비', family: '가족' };
const MEMBER_COLOR_VAR = {
  dad: 'var(--m-dad)', mom: 'var(--m-mom)',
  robi: 'var(--m-robi)', dobi: 'var(--m-dobi)',
  family: 'var(--m-family)'
};

const CATEGORIES = [
  { id: 'task',        name: '할 일',            desc: '가족별 수동 입력 task',                sheet: 'health_tasks',     icon: '✓' },
  { id: 'schedule',    name: '운동 스케줄',       desc: '도비/로비 — 요일 반복 또는 단발 날짜',   sheet: 'schedule',         icon: '🏃' },
  { id: 'vital',       name: 'Vital',           desc: '키 / 몸무게 / 혈압 / 혈당 / 체온',      sheet: 'vital',            icon: 'V' },
  { id: 'medication',  name: 'Medication',      desc: '투약 · 영양제',                        sheet: 'medication',       icon: 'Rx' },
  { id: 'hospital',    name: 'Hospital report', desc: '외부병원 진료 (C/C · P/I · A/P)',      sheet: 'hospital_report',  icon: 'H' },
  { id: 'home',        name: 'Home clinic',     desc: '가정 내 진료 + 사진 첨부 가능',         sheet: 'home_clinic',      icon: 'HC' },
  { id: 'progress',    name: 'Progress note',   desc: '재진료 이어서 (Assessment · Plan)',    sheet: 'progress_note',    icon: 'PN' },
  { id: 'vaccination', name: 'Vaccination',     desc: '예방접종 이력',                        sheet: 'vaccination',      icon: 'VA' },
  { id: 'condition',   name: 'Condition',       desc: '보유질환 추가',                        sheet: 'conditions',       icon: 'C' },
  { id: 'allergy',     name: 'Allergy',         desc: '알레르기 추가',                        sheet: 'allergies',        icon: 'A' },
  { id: 'momsnote',    name: "Mom's Note",      desc: '증상·대상자·기타 — 4가지 필수 입력',  sheet: 'symptom',          icon: '📝' },
];

/* ─── 부팅 ───────────────────────────────────────── */
document.getElementById('hdr-mount').innerHTML = FamilyOS.renderHeaderHTML({
  title: 'Health', sub: '가족 건강'
});
document.getElementById('ftr-mount').innerHTML = FamilyOS.renderFooterHTML({
  left: 'Family OS · Health',
  right: 'v0.1.0'
});
document.getElementById('modal-mount').innerHTML = FamilyOS.renderSettingsModalHTML({
  fields: [{ id: DASHBOARD_ID, label: 'Health (건강)' }],
  title: 'Health Web App URL 설정',
  desc: '이 대시보드의 Apps Script Web App URL을 입력하세요. 이 정보는 이 기기 브라우저에만 저장됩니다.'
});
FamilyOS.attachSettingsModal({
  fieldIds: [DASHBOARD_ID],
  onSave: refresh
});

// 새로고침 버튼
document.getElementById('fos-btn-refresh')?.addEventListener('click', refresh);

// 액션 버튼들
document.getElementById('btn-add-record').addEventListener('click', () => openCategoryPicker());
document.getElementById('btn-export-excel').addEventListener('click', () => downloadExcel());

// 빈 상태 안 버튼 위임
document.getElementById('main-mount').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-fos-action]');
  if (!btn) return;
  if (btn.dataset.fosAction === 'open-settings') {
    document.getElementById('fos-btn-settings')?.click();
  } else if (btn.dataset.fosAction === 'retry') {
    refresh();
  }
});

// 모달 닫기 / 뒤로
document.getElementById('h-modal-close').addEventListener('click', closeHModal);
document.getElementById('h-modal-cancel').addEventListener('click', closeHModal);
document.getElementById('h-modal-back').addEventListener('click', () => openCategoryPicker());
document.getElementById('h-modal-submit').addEventListener('click', () => submitForm());
document.getElementById('h-modal-backdrop').addEventListener('click', (e) => {
  if (e.target.id === 'h-modal-backdrop') closeHModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    const bd = document.getElementById('h-modal-backdrop');
    if (bd.classList.contains('open')) closeHModal();
  }
});

/* ─── 데이터 로드 ──────────────────────────────────── */
async function refresh() {
  const mount = document.getElementById('main-mount');

  if (!FamilyOS.getWebAppUrl(DASHBOARD_ID)) {
    mount.innerHTML = FamilyOS.renderUnsetStateHTML();
    FamilyOS.setLastSync('—');
    return;
  }

  mount.innerHTML = FamilyOS.renderLoadingStateHTML();
  FamilyOS.setLastSync('동기화 중…');

  try {
    const data = await FamilyOS.fetchDashboardData(DASHBOARD_ID, 'full');
    state.sheets = data.sheets || {};
    state.members = state.sheets.members || [];
    renderMemberTabs();
    renderView();
    FamilyOS.setSyncedNow();
  } catch (err) {
    console.error('[health] fetch failed:', err);
    mount.innerHTML = FamilyOS.renderErrorStateHTML(err.message, { retryId: DASHBOARD_ID });
    FamilyOS.setLastSync('동기화 실패');
  }
}

/* ─── 멤버 탭 ───────────────────────────────────── */
function renderMemberTabs() {
  const tabs = document.getElementById('member-tabs');
  const order = state.members
    .map(m => m.member_id)
    .filter(id => MEMBER_ORDER.includes(id))
    .sort((a, b) => MEMBER_ORDER.indexOf(a) - MEMBER_ORDER.indexOf(b));

  let html = '<button class="health-tab" data-view="all">전체</button>';
  order.forEach(id => {
    const m = state.members.find(x => x.member_id === id);
    if (!m) return;
    html += `<button class="health-tab" data-view="${id}">
      <span class="mdot" style="background:${MEMBER_COLOR_VAR[id]}"></span>${escapeHtml(MEMBER_LABELS[id] || m.name)}
    </button>`;
  });
  tabs.innerHTML = html;

  tabs.querySelectorAll('.health-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      state.currentView = btn.dataset.view;
      tabs.querySelectorAll('.health-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderView();
    });
  });
  // 현재 뷰 활성화
  const cur = tabs.querySelector(`[data-view="${state.currentView}"]`);
  if (cur) cur.classList.add('active');
  else tabs.querySelector('[data-view="all"]')?.classList.add('active');
}

/* ─── 뷰 렌더링 ───────────────────────────────── */
function renderView() {
  if (state.currentView === 'all') {
    renderAllView();
  } else {
    renderPersonView(state.currentView);
  }
  // 차트는 DOM 삽입 후 그려야 함
  setTimeout(() => {
    if (state.currentView !== 'all') {
      renderBloodChart(state.currentView);
      renderVitalChart(state.currentView);
    }
  }, 30);
}

function renderAllView() {
  const mount = document.getElementById('main-mount');
  const memberCardsHtml = MEMBER_ORDER
    .map(id => state.members.find(m => m.member_id === id))
    .filter(Boolean)
    .map(m => renderMemberCardHtml(m))
    .join('');

  mount.innerHTML = `
    <div class="grid-members">${memberCardsHtml}</div>
    <div class="grid-2">
      <div>
        ${renderScheduleCardHtml()}
        <section class="h-card">
          <div class="h-card-title"><span>할 일</span>
            <span class="right link" id="add-task-link">+ 추가</span>
          </div>
          <div id="tasks-body">${renderTasksHtml(null)}</div>
        </section>
      </div>
      <div>
        <section class="h-card">
          <div class="h-card-title"><span>Recent updates</span>
            <span class="right link" id="refresh-link">새로고침</span>
          </div>
          <div id="recent-body">${renderRecentHtml(null, 8)}</div>
        </section>
      </div>
    </div>
  `;
  // 이벤트 위임
  document.getElementById('add-task-link').addEventListener('click', () => openForm('task'));
  document.getElementById('refresh-link').addEventListener('click', refresh);
  const addSchedLink = document.getElementById('add-schedule-link');
  if (addSchedLink) addSchedLink.addEventListener('click', () => openForm('schedule'));
  // 멤버 카드 클릭 → 개인뷰
  mount.querySelectorAll('.member-card').forEach(card => {
    card.addEventListener('click', () => {
      const id = card.dataset.memberId;
      state.currentView = id;
      renderMemberTabs();
      renderView();
    });
  });
  // task 핸들러
  attachTaskHandlers();
  // recent 클릭 (home clinic detail)
  attachRecentHandlers();
}

function renderMemberCardHtml(m) {
  const id = m.member_id;
  const age = computeAge(m.birth_date);
  const status = computeMemberStatus(id);
  const statusColor = status === 'bad' ? 'var(--st-bad)' :
                      status === 'warn' ? 'var(--st-warn)' : 'var(--st-ok)';
  const latestH = getLatestVital(id, 'height');
  const latestW = getLatestVital(id, 'weight');
  const hcm = latestH ? parseFloat(latestH.value) : (m.height_cm ? parseFloat(m.height_cm) : null);
  const wkg = latestW ? parseFloat(latestW.value) : null;
  const bmi = (hcm && wkg) ? (wkg / Math.pow(hcm/100, 2)).toFixed(1) : null;

  const activeConds = (state.sheets.conditions || [])
    .filter(c => c.member_id === id && c.status !== 'resolved');
  const condChips = activeConds.slice(0, 3).map(c =>
    `<span class="cond-chip">${escapeHtml(c.condition_name)}</span>`
  ).join('');
  const moreCount = activeConds.length > 3 ? `<span class="cond-chip">+${activeConds.length - 3}</span>` : '';

  return `
    <div class="member-card" data-member-id="${id}" style="--mcolor: ${MEMBER_COLOR_VAR[id]}">
      <div class="top">
        <div class="name">${escapeHtml(MEMBER_LABELS[id])}</div>
        <div class="status-dot" style="background: ${statusColor}" title="status: ${status}"></div>
      </div>
      <div class="meta">${age ? age + '세' : ''}${m.gender ? ' · ' + (m.gender === 'M' ? '남' : '여') : ''}${m.blood_type ? ' · ' + m.blood_type : ''}</div>
      <div class="bmi-row">
        ${wkg ? `<div><span class="label">체중</span><span class="val">${wkg}kg</span></div>` : ''}
        ${bmi ? `<div><span class="label">BMI</span><span class="val">${bmi}</span></div>` : ''}
      </div>
      ${condChips || moreCount ? `<div class="conds">${condChips}${moreCount}</div>` : ''}
    </div>
  `;
}

/* ─── Task 렌더링 ─────────────────────────────── */
function renderTasksHtml(filterMember) {
  const tasks = state.sheets.health_tasks || [];
  if (tasks.length === 0) {
    return `<div class="task-empty">아직 등록된 할 일이 없어요. 우측 + 추가로 시작하세요.</div>`;
  }

  const todayStr = formatYMD(new Date());

  // 미완료 위, 완료 아래, 멤버별 그룹
  const filtered = filterMember
    ? tasks.filter(t => t.member_id === filterMember || t.member_id === 'family')
    : tasks;

  // 정렬: 미완료 우선, 그 안에서 기한 지남 > 기한 가까운 순
  const sorted = filtered.slice().sort((a, b) => {
    const ac = !!a.completed_at, bc = !!b.completed_at;
    if (ac !== bc) return ac ? 1 : -1;
    const ad = a.due_date ? formatYMD(a.due_date) : '9999-99-99';
    const bd = b.due_date ? formatYMD(b.due_date) : '9999-99-99';
    return ad.localeCompare(bd);
  });

  // 멤버별 그룹
  const groups = {};
  MEMBER_ORDER.concat(['family']).forEach(id => { groups[id] = []; });
  sorted.forEach(t => {
    const k = MEMBER_ORDER.includes(t.member_id) ? t.member_id :
              (t.member_id === 'family' ? 'family' : 'family');
    groups[k].push(t);
  });

  let html = '';
  MEMBER_ORDER.concat(['family']).forEach(id => {
    if (groups[id].length === 0) return;
    html += `<div class="task-group">
      <div class="task-group-head" style="--mcolor: ${MEMBER_COLOR_VAR[id]}">
        <span class="dot"></span>${escapeHtml(MEMBER_LABELS[id])}
      </div>`;
    groups[id].forEach(t => {
      const completed = !!t.completed_at;
      const due = t.due_date ? formatYMD(t.due_date) : null;
      const overdue = !completed && due && due < todayStr;
      const cls = completed ? 'done' : (overdue ? 'bad' : 'warn');
      const dueLabel = due
        ? (completed ? `완료 · ${formatRelativeDate(t.completed_at)}`
                     : `마감 ${formatDueRelative(due, todayStr)}`)
        : (completed ? `완료 · ${formatRelativeDate(t.completed_at)}` : '기한 없음');
      html += `
        <div class="task-row ${cls}" data-record-id="${escapeHtml(t.record_id)}">
          <button class="check" data-action="toggle" title="${completed ? '미완료로' : '완료'}">
            ${completed ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>' : ''}
          </button>
          <div class="body">
            <div class="title">${escapeHtml(t.title)}</div>
            <div class="meta">${dueLabel}${t.notes ? ' · ' + escapeHtml(t.notes) : ''}</div>
          </div>
          <button class="del" data-action="delete" title="삭제">×</button>
        </div>`;
    });
    html += `</div>`;
  });
  return html || `<div class="task-empty">표시할 할 일이 없어요.</div>`;
}

function attachTaskHandlers() {
  document.querySelectorAll('.task-row').forEach(row => {
    const recordId = row.dataset.recordId;
    row.querySelector('[data-action="toggle"]')?.addEventListener('click', async (e) => {
      e.stopPropagation();
      const isDone = row.classList.contains('done');
      try {
        const r = await apiPost({
          action: 'togglecomplete',
          record_id: recordId,
          completed: !isDone
        });
        if (r.ok) {
          // 로컬 상태 업데이트
          const task = (state.sheets.health_tasks || []).find(t => t.record_id === recordId);
          if (task) task.completed_at = !isDone ? new Date().toISOString() : '';
          // 재렌더
          if (state.currentView === 'all') {
            document.getElementById('tasks-body').innerHTML = renderTasksHtml(null);
            attachTaskHandlers();
            // 멤버 카드 상태도 업데이트
            document.querySelectorAll('.member-card').forEach(c => {
              const id = c.dataset.memberId;
              const newStatus = computeMemberStatus(id);
              const color = newStatus === 'bad' ? 'var(--st-bad)' :
                            newStatus === 'warn' ? 'var(--st-warn)' : 'var(--st-ok)';
              c.querySelector('.status-dot').style.background = color;
            });
          }
        } else {
          showToast('error', r.error || '저장 실패');
        }
      } catch (err) {
        showToast('error', err.message);
      }
    });
    row.querySelector('[data-action="delete"]')?.addEventListener('click', async (e) => {
      e.stopPropagation();
      if (!confirm('이 할 일을 삭제할까요?')) return;
      try {
        const r = await apiPost({
          action: 'delete',
          sheet: 'health_tasks',
          record_id: recordId
        });
        if (r.ok) {
          state.sheets.health_tasks = (state.sheets.health_tasks || [])
            .filter(t => t.record_id !== recordId);
          if (state.currentView === 'all') {
            document.getElementById('tasks-body').innerHTML = renderTasksHtml(null);
            attachTaskHandlers();
          }
          showToast('ok', '삭제됨');
        } else {
          showToast('error', r.error || '삭제 실패');
        }
      } catch (err) {
        showToast('error', err.message);
      }
    });
  });
}

/* ─── Recent updates 렌더링 ─────────────────────── */
function renderRecentHtml(filterMember, limit) {
  // 모든 시트에서 최근 N개 통합
  const items = [];
  const pushItem = (sheet, row) => items.push({ sheet, row, sortKey: getSortKey(row) });

  ['hospital_report', 'home_clinic', 'progress_note', 'medication', 'vital',
   'blood_test', 'healthcheck', 'imaging', 'conditions', 'allergies',
   'vaccination', 'symptom'].forEach(sheet => {
    (state.sheets[sheet] || []).forEach(row => {
      if (filterMember && row.member_id !== filterMember) return;
      pushItem(sheet, row);
    });
  });

  items.sort((a, b) => (b.sortKey || '').localeCompare(a.sortKey || ''));
  const top = items.slice(0, limit || 10);

  if (top.length === 0) {
    return `<div class="task-empty">아직 기록이 없어요.</div>`;
  }

  return top.map(({ sheet, row }) => renderRecentItemHtml(sheet, row)).join('');
}

function getSortKey(row) {
  return String(row.note_date || row.visit_date || row.date || row.test_date ||
    row.check_date || row.exam_date || row.diagnosis_date || row.start_date ||
    row.onset_datetime || '');
}

function renderRecentItemHtml(sheet, row) {
  const m = state.members.find(x => x.member_id === row.member_id);
  const who = m ? (m.name || MEMBER_LABELS[row.member_id]) : (row.member_id || '');
  const sortDate = getSortKey(row).slice(0, 10);

  let icon, iconCls, title, detail = '';
  let clickable = false, recordId = '';
  let chartNumBadge = '';

  switch (sheet) {
    case 'hospital_report':
      icon = 'H'; iconCls = 'hospital';
      title = `${row.hospital || ''}${row.department ? ' · ' + row.department : ''}`;
      detail = row.chief_complaint || '';
      clickable = true;
      recordId = row.record_id || '';
      chartNumBadge = row.record_id ? `<span class="chart-num">차트 ${row.record_id}</span>` : '';
      break;
    case 'home_clinic':
      icon = 'HC'; iconCls = 'home';
      title = row.chief_complaint || '가정진료';
      detail = row.assessment_plan || '';
      clickable = true;
      recordId = row.record_id || '';
      chartNumBadge = row.record_id ? `<span class="chart-num">차트 ${row.record_id}</span>` : '';
      break;
    case 'progress_note':
      icon = 'PN'; iconCls = 'progress';
      title = `경과기록${row.day_number ? ' #' + row.day_number : ''} (${row.parent_record_id || ''})`;
      detail = row.assessment || row.plan || '';
      // PN 클릭 시 부모 HC 팝업 열기 (parent_record_id 있을 때만)
      if (row.parent_record_id) {
        clickable = true;
        recordId = row.parent_record_id;
        chartNumBadge = `<span class="chart-num">차트 ${row.parent_record_id}</span>`;
      }
      break;
    case 'medication':
      icon = 'Rx'; iconCls = 'medication';
      title = `${row.drug_name || ''}${row.dose ? ' ' + row.dose : ''}${row.frequency ? ' · ' + row.frequency : ''}`;
      detail = row.end_date ? `종료 ${row.end_date}` : '현재 복용 중';
      break;
    case 'vital':
      icon = 'V'; iconCls = 'vital';
      title = `${row.item || ''} ${row.value || ''}${row.unit || ''}`;
      break;
    case 'blood_test':
      icon = 'BT'; iconCls = 'bloodtest';
      title = `${row.item || ''} ${row.value || ''}${row.unit || ''}${row.flag ? ' (' + row.flag + ')' : ''}`;
      break;
    case 'healthcheck':
      icon = 'CK'; iconCls = 'checkup';
      title = `건강검진 — ${row.hospital || ''}`;
      detail = row.conclusion_text || '';
      break;
    case 'imaging':
      icon = 'IM'; iconCls = 'imaging';
      title = `${row.modality || ''}${row.body_part ? ' · ' + row.body_part : ''}`;
      detail = row.conclusion_text || '';
      break;
    case 'conditions':
      icon = 'C'; iconCls = 'condition';
      title = `${row.condition_name || ''} (${row.status || ''})`;
      detail = row.notes || '';
      break;
    case 'allergies':
      icon = 'A'; iconCls = 'allergy';
      title = `${row.allergen || ''}${row.severity ? ' · ' + row.severity : ''}`;
      detail = row.reaction || '';
      break;
    case 'vaccination':
      icon = 'VA'; iconCls = 'vaccination';
      title = `${row.vaccine_name || ''}${row.dose_number ? ' ' + row.dose_number + '/' + (row.total_doses || '') : ''}`;
      break;
    case 'symptom':
      icon = 'MN'; iconCls = 'symptom';
      title = row.chief_complaint || "Mom's Note";
      detail = row.notes || '';
      break;
    default:
      icon = '?'; iconCls = '';
      title = row.record_id || sheet;
  }

  // 사진 (home_clinic, hospital_report)
  let photosHtml = '';
  if ((sheet === 'home_clinic' || sheet === 'hospital_report') && row.photo_drive_ids) {
    const ids = String(row.photo_drive_ids).split(',').map(s => s.trim()).filter(Boolean);
    if (ids.length > 0) {
      photosHtml = `<div class="recent-photos">${ids.slice(0, 3).map(id =>
        renderPhotoThumb(id, false)
      ).join('')}</div>`;
    }
  }

  return `
    <div class="recent-item ${clickable ? 'clickable' : ''}" ${clickable ? `data-record-id="${escapeHtml(recordId)}" data-sheet="${escapeHtml(sheet)}"` : ''}>
      <div class="icon ${iconCls}">${icon}</div>
      <div class="body">
        <div class="head-row">
          <span class="who">${escapeHtml(who)}</span>
          <span class="date">${escapeHtml(sortDate)}</span>
          ${chartNumBadge}
        </div>
        <div class="title">${escapeHtml(title)}</div>
        ${detail ? `<div class="detail">${escapeHtml(detail)}</div>` : ''}
        ${photosHtml}
      </div>
    </div>
  `;
}

function attachRecentHandlers() {
  document.querySelectorAll('.recent-item.clickable').forEach(el => {
    el.addEventListener('click', () => {
      const sheet = el.dataset.sheet;
      const recordId = el.dataset.recordId;
      if (sheet === 'hospital_report') {
        openHospitalReportDetail(recordId);
      } else {
        // home_clinic, progress_note (parent_record_id 로 HC 열기)
        openHomeClinicDetail(recordId);
      }
    });
  });
}

/* ─── 운동 스케줄 카드 (메인 전체 화면용) ─────────── */
function renderScheduleCardHtml() {
  const rows = (state.sheets.schedule || []).filter(r => {
    if (r.member_id !== 'robi' && r.member_id !== 'dobi') return false;
    // active 필드: TRUE/true/빈값 = 활성
    const active = r.active;
    return active === true || active === 'TRUE' || active === 'true' || active === '' || active == null;
  });

  // 분리: weekly (weekday 있고 event_date 없음) / oneoff (event_date 있음)
  const weeklyRows = rows.filter(r => r.weekday && !r.event_date);
  const oneoffRows = rows.filter(r => r.event_date);

  const isEmpty = weeklyRows.length === 0 && oneoffRows.length === 0;
  const inner = isEmpty
    ? `<div class="sched-empty">아직 등록된 스케줄이 없어요. 우측 + 추가에서 시작하세요.</div>`
    : `
        ${renderWeeklyCalendarHtml(weeklyRows)}
        ${renderOneoffListHtml(oneoffRows)}
      `;

  return `
    <section class="h-card sched-card">
      <div class="h-card-title">
        <span>운동 스케줄 — 도비 · 로비</span>
        <span class="right link" id="add-schedule-link">+ 추가</span>
      </div>
      ${inner}
    </section>
  `;
}

function renderWeeklyCalendarHtml(weeklyRows) {
  if (weeklyRows.length === 0) return '';

  // 그룹: (member_id|title) 단위로 묶기. 시간 정보는 첫 행 기준 (한 활동을 여러 요일에 등록한 케이스 대응)
  const groups = {};
  weeklyRows.forEach(r => {
    const key = `${r.member_id}|${r.title || ''}`;
    if (!groups[key]) {
      groups[key] = {
        member_id: r.member_id,
        title: r.title || '',
        weekdays: new Set(),
        sampleRow: r
      };
    }
    groups[key].weekdays.add(String(r.weekday).toLowerCase());
  });

  const dayKeys = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
  const dayLabels = ['월', '화', '수', '목', '금', '토', '일'];
  const todayDay = new Date().getDay();
  const todayIdx = todayDay === 0 ? 6 : todayDay - 1;

  let html = `
    <div class="sched-section">
      <div class="sched-section-head">
        <div class="sched-who">매주 반복</div>
      </div>
      <div class="week-cal">
        <div class="week-cal-cell" style="background:transparent"></div>
        ${dayLabels.map((lbl, i) => `
          <div class="week-cal-cell week-cal-day-header${i === todayIdx ? ' today' : ''}">${lbl}</div>
        `).join('')}
  `;

  // 도비 먼저, 로비 다음 정렬
  const ordered = Object.values(groups).sort((a, b) => {
    const memOrder = { dobi: 0, robi: 1 };
    if (a.member_id !== b.member_id) return memOrder[a.member_id] - memOrder[b.member_id];
    return (a.title || '').localeCompare(b.title || '');
  });

  ordered.forEach(g => {
    const memberName = MEMBER_LABELS[g.member_id] || g.member_id;
    const meta = [];
    if (g.sampleRow.start_time) meta.push(escapeHtml(g.sampleRow.start_time));
    if (g.sampleRow.location) meta.push(escapeHtml(g.sampleRow.location));
    const metaStr = meta.length > 0 ? ` · ${meta.join(' · ')}` : '';
    html += `
      <div class="week-cal-row-label" title="${escapeHtml(g.title)}${metaStr}">
        <span class="sched-who-badge ${g.member_id}">${escapeHtml(memberName)}</span>
        ${escapeHtml(g.title)}
      </div>
    `;
    dayKeys.forEach((dk, i) => {
      const has = g.weekdays.has(dk);
      html += `<div class="week-cal-cell${has ? ' has-event' : ''}${i === todayIdx ? ' today' : ''}">${has ? '●' : ''}</div>`;
    });
  });

  html += `</div></div>`;
  return html;
}

function renderOneoffListHtml(oneoffRows) {
  if (oneoffRows.length === 0) return '';

  // 미래 우선, 그 다음 과거 (오늘 포함). 30일 이상 지난 건 제외.
  const today = formatYMD(new Date());
  const thirtyDaysAgo = (() => {
    const d = new Date(); d.setDate(d.getDate() - 30);
    return formatYMD(d);
  })();
  const items = oneoffRows
    .filter(r => formatYMD(r.event_date) >= thirtyDaysAgo)
    .map(r => ({
      row: r,
      dateStr: formatYMD(r.event_date),
      isPast: formatYMD(r.event_date) < today,
      isToday: formatYMD(r.event_date) === today
    }))
    .sort((a, b) => {
      // 미래 (today 포함) 먼저, 가까운 순. 과거는 뒤에 최근 순
      if (a.isPast !== b.isPast) return a.isPast ? 1 : -1;
      if (a.isPast) return b.dateStr.localeCompare(a.dateStr);
      return a.dateStr.localeCompare(b.dateStr);
    })
    .slice(0, 10);

  if (items.length === 0) return '';

  return `
    <div class="sched-section">
      <div class="sched-section-head">
        <div class="sched-who">단발 일정</div>
      </div>
      <div class="sched-oneoff-list">
        ${items.map(({ row, dateStr, isPast, isToday }) => {
          const memberName = MEMBER_LABELS[row.member_id] || row.member_id;
          const time = row.start_time ? `${row.start_time}${row.end_time ? '~' + row.end_time : ''}` : '';
          const loc = row.location ? ` · ${escapeHtml(row.location)}` : '';
          return `
            <div class="sched-oneoff-item${isPast ? ' past' : ''}">
              <span class="date${isToday ? ' today' : ''}">${escapeHtml(dateStr)}${isToday ? ' (오늘)' : ''}</span>
              <span class="sched-who-badge ${row.member_id}">${escapeHtml(memberName)}</span>
              <span class="title">${escapeHtml(row.title || '')}</span>
              <span class="meta">${escapeHtml(time)}${loc}</span>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

function drawLineChart(canvasId, chartKey, labels, data, color) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  if (state.charts[chartKey]) {
    state.charts[chartKey].destroy();
  }
  const textColor  = getCss('--text-tertiary');
  const borderColor = getCss('--border');

  state.charts[chartKey] = new Chart(canvas, {
    type: 'line',
    data: {
      labels: labels,
      datasets: [{
        data: data,
        borderColor: color || getCss('--acc-health'),
        backgroundColor: (color || getCss('--acc-health')) + '22',
        fill: true,
        tension: 0.3,
        pointRadius: 3,
        pointBackgroundColor: color || getCss('--acc-health'),
        borderWidth: 2
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: {
          ticks: { color: textColor, font: { size: 10 } },
          grid: { color: borderColor }
        },
        y: {
          ticks: { color: textColor, font: { size: 10 } },
          grid: { color: borderColor }
        }
      }
    }
  });
}

function getCss(name) {

/* ─── 사진 업로드 ─────────────────────────────── */
function handlePhotoSelect(input) {
  const files = Array.from(input.files);
  const remaining = 3 - state.pendingPhotos.length;
  if (remaining <= 0) {
    showToast('error', '최대 3장까지 가능합니다');
    input.value = '';
    return;
  }
  files.slice(0, remaining).forEach(file => {
    resizeImageFile(file, 1000, 0.75).then(({ dataUrl }) => {
      state.pendingPhotos.push({ dataUrl, name: file.name });
      renderPhotoStrip();
    });
  });
  input.value = '';
}
window.handlePhotoSelect = handlePhotoSelect;

function resizeImageFile(file, maxWidth, quality) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let w = img.width, h = img.height;
        if (w > maxWidth) { h = Math.round(h * maxWidth / w); w = maxWidth; }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve({ dataUrl: canvas.toDataURL('image/jpeg', quality) });
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function renderPhotoStrip() {
  const strip = document.getElementById('photo-strip');
  if (!strip) return;
  strip.innerHTML = state.pendingPhotos.map((p, i) => `
    <div class="photo-preview">
      <img src="${p.dataUrl}" alt="사진 ${i+1}">
      <div class="photo-preview-del" onclick="removePhoto(${i})">×</div>
    </div>
  `).join('');
}

function removePhoto(i) {
  state.pendingPhotos.splice(i, 1);
  renderPhotoStrip();
}
window.removePhoto = removePhoto;

async function uploadPendingPhotos() {
  const ids = [];
  const errors = [];
  for (let i = 0; i < state.pendingPhotos.length; i++) {
    const p = state.pendingPhotos[i];
    try {
      const r = await apiPost({
        action: 'uploadphoto',
        base64: p.dataUrl.split(',')[1],
        filename: 'hc_' + Date.now() + '_' + i + '.jpg',
        mimetype: 'image/jpeg'
      });
      console.log('[photo upload]', i, r);
      if (r.ok && r.file_id) {
        ids.push(r.file_id);
      } else {
        errors.push(r.error || '응답에 file_id 없음');
      }
    } catch (e) {
      console.error('[photo upload] exception:', e);
      errors.push(e.message);
    }
  }
  return { ids: ids.join(','), errors: errors };
}

/* ─── 폼 제출 ─────────────────────────────────── */
async function submitForm() {
  if (state.isSubmitting) return;
  const cat = state.currentCategory;
  if (!cat) return;

  const body = document.getElementById('h-modal-body');

  // Mom's Note 4필드 검증
  if (cat.id === 'momsnote') {
    let ok = true;
    body.querySelectorAll('.mn-field').forEach(f => f.classList.remove('error'));
    if (!getPickedMember()) {
      body.querySelectorAll('.mn-field')[0].classList.add('error'); ok = false;
    }
    const fields = body.querySelectorAll('.mn-field');
    [['onset_datetime', 1], ['chief_complaint', 2], ['notes', 3]].forEach(([n, idx]) => {
      const el = body.querySelector(`[name="${n}"]`);
      if (!el || !el.value.trim()) {
        fields[idx].classList.add('error'); ok = false;
      }
    });
    if (!ok) {
      showToast('error', '4가지 항목을 모두 입력하세요');
      return;
    }
  }

  // 폼 데이터 수집
  const data = {};
  body.querySelectorAll('input, select, textarea').forEach(el => {
    if (el.name) data[el.name] = el.value;
  });
  // 멤버 picker
  const picked = getPickedMember();
  if (picked) data.member_id = picked;

  // 필수 필드 체크
  if (!data.member_id) {
    showToast('error', '대상자를 선택하세요');
    return;
  }

  // task 카테고리: 빈 필드 정리
  if (cat.id === 'task') {
    if (!data.title || !data.title.trim()) {
      showToast('error', '제목을 입력하세요');
      return;
    }
    data.completed_at = '';
  }

  // schedule 카테고리: weekly/oneoff 분기 처리
  if (cat.id === 'schedule') {
    if (!data.title || !data.title.trim()) {
      showToast('error', '활동명을 입력하세요');
      return;
    }
    // mode picker 값 추출 (id=sched-mode-picker)
    const modePicker = body.querySelector('#sched-mode-picker');
    const modeActive = modePicker ? modePicker.querySelector('.mem-pick-btn.active') : null;
    const mode = modeActive ? modeActive.dataset.value : 'weekly';
    if (mode === 'weekly') {
      // event_date 비우기 (시트의 weekday만 사용)
      data.event_date = '';
      if (!data.weekday) {
        showToast('error', '요일을 선택하세요');
        return;
      }
    } else {
      // weekday 비우기
      data.weekday = '';
      if (!data.event_date) {
        showToast('error', '날짜를 선택하세요');
        return;
      }
    }
    // 도비/로비만 가능
    if (data.member_id !== 'robi' && data.member_id !== 'dobi') {
      showToast('error', '도비 또는 로비를 선택하세요');
      return;
    }
  }

  // idempotency
  data.client_req_id = 'client-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);

  state.isSubmitting = true;
  const submitBtn = document.getElementById('h-modal-submit');
  submitBtn.disabled = true;
  submitBtn.textContent = '저장 중…';

  try {
    // home_clinic / hospital_report: 사진 먼저 업로드
    if ((cat.id === 'home' || cat.id === 'hospital') && state.pendingPhotos.length > 0) {
      submitBtn.textContent = '사진 업로드 중…';
      const { ids: photoIds, errors } = await uploadPendingPhotos();
      const total = state.pendingPhotos.length;
      const ok = photoIds ? photoIds.split(',').length : 0;
      if (ok === 0 && total > 0) {
        // 전부 실패 — 본문 저장 중단
        showToast('error', '사진 업로드 실패 (' + (errors[0] || 'unknown') + '). 콘솔 확인 후 다시 시도하세요.');
        state.isSubmitting = false;
        submitBtn.disabled = false;
        submitBtn.textContent = '저장';
        return;
      }
      if (errors.length > 0) {
        // 일부 실패 — 사용자에게 알림 후 진행
        showToast('error', '사진 ' + errors.length + '/' + total + '장 업로드 실패. 저장은 진행합니다.');
      }
      data.photo_drive_ids = photoIds;
    }

    submitBtn.textContent = '저장 중…';
    const r = await apiPost({ action: 'add', sheet: cat.sheet, data });

    if (r.ok) {
      showToast('ok', r.duplicate ? '이미 저장된 기록' : '저장 완료');
      closeHModal();
      // 부분 새로고침 — 일단 풀 리프레시
      await refresh();
    } else {
      showToast('error', r.error || '저장 실패');
    }
  } catch (err) {
    showToast('error', err.message);
  } finally {
    state.isSubmitting = false;
    submitBtn.disabled = false;
    submitBtn.textContent = '저장';
  }
}

/* ─── API 호출 ──────────────────────────────────── */
async function apiPost(body) {
  const url = FamilyOS.getWebAppUrl(DASHBOARD_ID);
  if (!url) throw new Error('Web App URL 미설정');
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body),
    redirect: 'follow'
  });
  return res.json();
}

      ['home_clinic', '가정진료'],
      ['progress_note', '경과기록'],
      ['medication', '투약'],
      ['vital', '신체계측'],
      ['blood_test', '혈액검사'],
      ['healthcheck', '건강검진'],
      ['imaging', '영상검사'],
      ['symptom', "Mom's Note"],
      ['conditions', '보유질환'],
      ['allergies', '알레르기'],
      ['vaccination', '접종'],
      ['health_tasks', '할 일'],
    ];

    exportSheets.forEach(([key, label]) => {
      const rows = state.sheets[key] || [];
      if (rows.length === 0) return;
      const ws = XLSX.utils.json_to_sheet(rows);
      XLSX.utils.book_append_sheet(wb, ws, label);
    });

    const today = new Date().toISOString().substring(0, 10);
    XLSX.writeFile(wb, `FamilyHealth_${today}.xlsx`);
    showToast('ok', 'Excel 파일 다운로드 완료');
  } catch (err) {
    console.error('Excel export error:', err);
    showToast('error', 'Excel 생성 실패: ' + err.message);
  }
}

/* ─── 유틸 ──────────────────────────────────────── */
function escapeHtml(s) { return FamilyOS.escapeHtml(s); }

/* Drive 썸네일 외부 임베드는 third-party 쿠키 차단 때문에 비정상 — placeholder 박스로 대체.
   클릭하면 Drive 에서 사용자 본인 로그인 세션으로 정상 표시됨. */
function renderPhotoThumb(id, large) {
  const cls = large ? 'photo-thumb photo-thumb-lg' : 'photo-thumb';
  const iconSize = large ? 28 : 20;
  return `<a class="${cls}" href="https://drive.google.com/file/d/${escapeHtml(id)}/view"
    target="_blank" rel="noopener" title="Drive에서 사진 열기"
    onclick="event.stopPropagation()">
    <svg width="${iconSize}" height="${iconSize}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
      <circle cx="8.5" cy="8.5" r="1.5"></circle>
      <polyline points="21 15 16 10 5 21"></polyline>
    </svg>
  </a>`;
}

function formatYMD(d) {
  if (!d) return null;
  if (typeof d === 'string') {
    // 이미 YYYY-MM-DD면 그대로
    if (/^\d{4}-\d{2}-\d{2}/.test(d)) return d.substring(0, 10);
    const dt = new Date(d);
    if (isNaN(dt.getTime())) return null;
    return dt.toISOString().substring(0, 10);
  }
  if (d instanceof Date) return d.toISOString().substring(0, 10);
  return null;
}

function formatRelativeDate(iso) {
  if (!iso) return '';
  const t = new Date(iso).getTime();
  if (isNaN(t)) return '';
  const diff = Math.floor((Date.now() - t) / 86400000);
  if (diff < 1) return '오늘';
  if (diff < 2) return '어제';
  if (diff < 7) return diff + '일 전';
  return new Date(t).toISOString().substring(0, 10);
}

function formatDueRelative(due, today) {
  if (!due) return '';
  const d1 = new Date(due).getTime();
  const d2 = new Date(today).getTime();
  if (isNaN(d1) || isNaN(d2)) return due;
  const diff = Math.floor((d1 - d2) / 86400000);
  if (diff === 0) return '오늘';
  if (diff === 1) return '내일';
  if (diff < 0) return `D+${Math.abs(diff)} (지남)`;
  return `D-${diff}`;
}

function todayDatetimeLocal() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function computeAge(birthDate) {
  if (!birthDate) return null;
  const bd = new Date(birthDate);
  if (isNaN(bd.getTime())) return null;
  const now = new Date();
  let age = now.getFullYear() - bd.getFullYear();
  const m = now.getMonth() - bd.getMonth();
  if (m < 0 || (m === 0 && now.getDate() < bd.getDate())) age--;
  return age;
}

function getLatestVital(memberId, item) {
  const rows = (state.sheets.vital || [])
    .filter(r => r.member_id === memberId && r.item === item);
  if (rows.length === 0) return null;
  return rows.slice().sort((a, b) => String(b.date).localeCompare(String(a.date)))[0];
}

function computeMemberStatus(memberId) {
  const tasks = (state.sheets.health_tasks || [])
    .filter(t => (t.member_id === memberId || t.member_id === 'family') && !t.completed_at);
  if (tasks.length === 0) return 'ok';
  const todayStr = formatYMD(new Date());
  const overdue = tasks.some(t => t.due_date && formatYMD(t.due_date) < todayStr);
  return overdue ? 'bad' : 'warn';
}

/* ─── 모달 open/close ─────────────────────────── */
function openHModal() {
  document.getElementById('h-modal-backdrop').classList.add('open');
}
function closeHModal() {
  document.getElementById('h-modal-backdrop').classList.remove('open');
  state.pendingPhotos = [];
}

/* ─── Toast ───────────────────────────────────── */
let toastTimer = null;
function showToast(kind, msg) {
  const el = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  el.classList.remove('ok', 'error', 'info');
  el.classList.add(kind || 'info', 'show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}
