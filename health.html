<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0B0F">
<title>Health — Family OS</title>

<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="stylesheet" href="./design-tokens.css">

<!-- 외부 라이브러리 -->
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
/* ─── 공통 레이아웃 ──────────────────────────────────────────── */
body {
  padding-top: var(--safe-top);
  padding-bottom: var(--safe-bottom);
  overflow-x: hidden;
}
.app {
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 var(--s6);
}
@media (max-width: 767px) {
  .app { padding: 0 var(--s4); }
}

header.hdr {
  display: flex; align-items: center; justify-content: space-between;
  padding: var(--s6) 0;
  border-bottom: 1px solid var(--border);
  margin-bottom: var(--s5);
}
@media (max-width: 767px) {
  header.hdr { padding: var(--s4) 0; margin-bottom: var(--s4); }
}
.brand { display: flex; align-items: baseline; gap: var(--s3); }
.brand-title {
  font-family: var(--font-display); font-weight: 500;
  font-size: 24px; letter-spacing: -0.01em; color: var(--text-primary);
  display: flex; align-items: center; gap: var(--s2);
}
.brand-title::before {
  content: ''; display: inline-block;
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--acc-health);
}
.brand-sub {
  font-size: 12px; color: var(--text-quiet);
  letter-spacing: 0.05em; text-transform: uppercase;
}
@media (max-width: 480px) {
  .brand-title { font-size: 20px; }
  .brand-sub { display: none; }
}
.hdr-actions { display: flex; gap: var(--s2); align-items: center; }
.icon-btn {
  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--r-md); color: var(--text-tertiary);
  transition: all var(--t-fast);
  background: transparent; border: none; cursor: pointer;
}
.icon-btn:hover { background: var(--elevated); color: var(--text-primary); }
.last-sync {
  font-size: 11px; color: var(--text-quiet); font-family: var(--font-mono);
  padding-right: var(--s2);
}
@media (max-width: 480px) { .last-sync { display: none; } }

footer.ftr {
  padding: var(--s5) 0 var(--s8);
  border-top: 1px solid var(--border);
  font-size: 11px; color: var(--text-quiet);
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: var(--s2);
}
footer.ftr .ftr-r { font-family: var(--font-mono); }

/* ─── 공통 모달 (common.js의 settings 모달과 짝) ─────────── */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(10, 11, 15, 0.7);
  backdrop-filter: blur(8px);
  display: none; align-items: center; justify-content: center;
  z-index: 100; padding: var(--s4);
}
.modal-backdrop.open { display: flex; }
.modal {
  background: var(--surface); border: 1px solid var(--border-hi);
  border-radius: var(--r-lg); padding: var(--s6);
  width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto;
  animation: modalIn 0.3s cubic-bezier(0.32, 0.72, 0, 1);
}
@keyframes modalIn {
  from { opacity: 0; transform: scale(0.96) translateY(8px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}
.modal-title {
  font-family: var(--font-display); font-size: 20px; font-weight: 500;
  margin-bottom: var(--s2);
}
.modal-desc {
  font-size: 12px; color: var(--text-tertiary); line-height: 1.6;
  margin-bottom: var(--s5);
}
.modal-field { margin-bottom: var(--s4); }
.modal-label {
  display: flex; align-items: center; gap: var(--s2);
  font-size: 11px; color: var(--text-secondary);
  text-transform: uppercase; letter-spacing: 0.06em;
  margin-bottom: var(--s2);
}
.modal-input {
  width: 100%; background: var(--canvas);
  border: 1px solid var(--border); border-radius: var(--r-sm);
  padding: 10px 12px; font-size: 12px; color: var(--text-primary);
  font-family: var(--font-mono); transition: border-color var(--t-fast);
}
.modal-input:focus { border-color: var(--accent); outline: none; }
.modal-input::placeholder { color: var(--text-quiet); }
.modal-actions {
  display: flex; gap: var(--s2); justify-content: flex-end; margin-top: var(--s5);
}
.btn {
  padding: 10px 18px; border-radius: var(--r-sm);
  font-size: 13px; font-weight: 500;
  transition: all var(--t-fast); border: 1px solid transparent;
  background: transparent; cursor: pointer; color: inherit;
  font-family: inherit;
}
.btn-primary { background: var(--accent); color: var(--canvas); }
.btn-primary:hover { background: #F5D175; }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-ghost {
  background: transparent; color: var(--text-secondary);
  border-color: var(--border);
}
.btn-ghost:hover { border-color: var(--border-hi); color: var(--text-primary); }
.btn-danger { background: var(--loss); color: white; border: none; }
.btn-danger:hover { background: #DC2626; }

/* ─── 공통 빈 상태 ──────────────────────────────────────── */
.state-empty {
  padding: var(--s8) var(--s5);
  color: var(--text-quiet); font-size: 13px;
  display: flex; flex-direction: column; gap: var(--s2);
  align-items: center; text-align: center;
}
.state-empty .ico {
  width: 32px; height: 32px; border-radius: var(--r-md);
  background: var(--elevated);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: var(--s2); color: var(--text-tertiary);
}
.state-empty .msg { color: var(--text-tertiary); font-size: 12px; }
.state-empty button {
  font-size: 12px; color: var(--accent);
  padding: 6px 10px; border: 1px solid var(--border);
  border-radius: var(--r-sm); background: transparent;
  margin-top: var(--s2); transition: all var(--t-fast); cursor: pointer;
}
.state-empty button:hover { border-color: var(--accent); background: var(--elevated); }
.spinner {
  width: 18px; height: 18px;
  border: 2px solid var(--elevated-2);
  border-top-color: var(--accent);
  border-radius: 50%; animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.gain  { color: var(--gain); }
.loss  { color: var(--loss); }
.muted { color: var(--text-quiet); }

/* ─── [Health 고유 스타일] ─────────────────────────────────── */

/* 멤버 색 매핑 — 다크 배경에서도 보이는 톤 */
:root {
  --m-dad:  #60A5FA;   /* 차분한 블루 */
  --m-mom:  #F472B6;   /* 핑크 */
  --m-robi: #C084FC;   /* 라벤더 */
  --m-dobi: #FB923C;   /* 오렌지 */
  --m-family: var(--acc-health);

  /* status 색 */
  --st-ok:   var(--gain);
  --st-warn: var(--neutral);
  --st-bad:  var(--loss);
  --st-done: var(--acc-health);
}

/* 멤버 탭 */
.health-tabs {
  display: flex; gap: var(--s2);
  padding: var(--s2);
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-md);
  margin-bottom: var(--s5);
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.health-tabs::-webkit-scrollbar { display: none; }
.health-tab {
  padding: 8px 14px;
  border-radius: var(--r-sm);
  font-size: 13px; font-weight: 500;
  color: var(--text-tertiary);
  background: transparent; border: none;
  cursor: pointer; transition: all var(--t-fast);
  white-space: nowrap;
  display: flex; align-items: center; gap: var(--s2);
}
.health-tab:hover { color: var(--text-primary); background: var(--elevated); }
.health-tab.active {
  background: var(--elevated-2); color: var(--text-primary);
}
.health-tab .mdot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

/* 액션 바 */
.health-actionbar {
  display: flex; gap: var(--s2); align-items: center;
  margin-bottom: var(--s5);
  flex-wrap: wrap;
}
.btn-action {
  padding: 8px 14px;
  font-size: 13px; font-weight: 500;
  border-radius: var(--r-sm);
  background: var(--acc-health); color: var(--canvas);
  border: none; cursor: pointer;
  display: flex; align-items: center; gap: 6px;
  transition: all var(--t-fast);
}
.btn-action:hover { background: #6EE7B7; }
.btn-action-ghost {
  background: transparent; color: var(--text-secondary);
  border: 1px solid var(--border);
}
.btn-action-ghost:hover { border-color: var(--border-hi); color: var(--text-primary); }

/* ─── 카드 공통 ─────────────────────────────────────────── */
.h-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: var(--s5);
  margin-bottom: var(--s4);
}
.h-card-title {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: var(--s4);
  display: flex; align-items: center; justify-content: space-between;
}
.h-card-title .right {
  font-family: var(--font-mono); color: var(--text-quiet);
  text-transform: none; letter-spacing: 0; font-weight: 400;
  font-size: 11px;
}
.h-card-title .right.link {
  cursor: pointer; color: var(--acc-health);
  transition: color var(--t-fast);
}
.h-card-title .right.link:hover { color: #6EE7B7; }

/* ─── 전체뷰 그리드 ─────────────────────────────────────── */
.grid-members {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--s4);
  margin-bottom: var(--s4);
}
@media (max-width: 1023px) {
  .grid-members { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 480px) {
  .grid-members { grid-template-columns: 1fr; }
}
.grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--s4);
}
@media (max-width: 1023px) {
  .grid-2 { grid-template-columns: 1fr; }
}

/* 멤버 카드 (전체뷰) */
.member-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: var(--s4);
  cursor: pointer;
  transition: all var(--t-fast);
  position: relative;
}
.member-card:hover {
  border-color: var(--border-hi);
  transform: translateY(-2px);
}
.member-card .top {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: var(--s3);
}
.member-card .name {
  font-size: 14px; font-weight: 600; color: var(--text-primary);
  display: flex; align-items: center; gap: var(--s2);
}
.member-card .name::before {
  content: ''; width: 8px; height: 8px; border-radius: 50%;
  background: var(--mcolor, var(--acc-health));
}
.member-card .status-dot {
  width: 10px; height: 10px; border-radius: 50%;
}
.member-card .meta {
  font-size: 11px; color: var(--text-tertiary);
  font-family: var(--font-mono);
  margin-bottom: var(--s2);
}
.member-card .bmi-row {
  display: flex; gap: var(--s4);
  font-size: 12px;
}
.member-card .bmi-row .label {
  color: var(--text-quiet); margin-right: 4px;
}
.member-card .bmi-row .val {
  color: var(--text-secondary); font-family: var(--font-mono);
}
.member-card .conds {
  font-size: 11px; color: var(--text-quiet);
  margin-top: var(--s2);
  display: flex; flex-wrap: wrap; gap: 4px;
}
.cond-chip {
  font-size: 10px;
  background: var(--elevated);
  color: var(--text-tertiary);
  padding: 2px 7px;
  border-radius: var(--r-full);
}

/* ─── Task 카드 ──────────────────────────────────────── */
.task-group { margin-bottom: var(--s4); }
.task-group:last-child { margin-bottom: 0; }
.task-group-head {
  font-size: 11px; color: var(--text-secondary);
  text-transform: uppercase; letter-spacing: 0.06em;
  margin-bottom: var(--s2);
  display: flex; align-items: center; gap: var(--s2);
}
.task-group-head .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--mcolor, var(--text-tertiary));
}
.task-row {
  display: flex; align-items: center; gap: var(--s3);
  padding: 10px var(--s3);
  border-radius: var(--r-sm);
  border-left: 3px solid var(--border);
  background: var(--elevated);
  margin-bottom: 6px;
  transition: all var(--t-fast);
}
.task-row.bad   { border-left-color: var(--st-bad); }
.task-row.warn  { border-left-color: var(--st-warn); }
.task-row.done  { border-left-color: var(--st-done); opacity: 0.5; }
.task-row .check {
  width: 18px; height: 18px;
  border: 1.5px solid var(--border-hi);
  border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0;
  transition: all var(--t-fast);
  background: transparent;
}
.task-row.done .check {
  background: var(--st-done); border-color: var(--st-done);
}
.task-row .check svg { width: 12px; height: 12px; color: var(--canvas); }
.task-row .body { flex: 1; min-width: 0; }
.task-row .title {
  font-size: 13px; color: var(--text-primary);
  line-height: 1.4;
}
.task-row.done .title { text-decoration: line-through; color: var(--text-quiet); }
.task-row .meta {
  font-size: 11px; color: var(--text-quiet);
  font-family: var(--font-mono);
  margin-top: 2px;
}
.task-row.bad .meta { color: var(--st-bad); }
.task-row .del {
  font-size: 16px; color: var(--text-quiet);
  cursor: pointer; opacity: 0;
  transition: opacity var(--t-fast);
  background: transparent; border: none;
}
.task-row:hover .del { opacity: 1; }
.task-row .del:hover { color: var(--loss); }
.task-empty {
  font-size: 12px; color: var(--text-quiet);
  padding: var(--s3); text-align: center;
}

/* ─── Recent updates ─────────────────────────────────── */
.recent-item {
  display: flex; gap: var(--s3);
  padding: var(--s3) 0;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
  cursor: default;
}
.recent-item:last-child { border-bottom: none; }
.recent-item.clickable { cursor: pointer; transition: background var(--t-fast);
  margin: 0 calc(-1 * var(--s3)); padding-left: var(--s3); padding-right: var(--s3);
  border-radius: var(--r-sm);
}
.recent-item.clickable:hover { background: var(--elevated); border-bottom-color: transparent; }
.recent-item .icon {
  width: 32px; height: 32px;
  border-radius: var(--r-sm);
  background: var(--elevated);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 600;
  color: var(--text-tertiary);
  flex-shrink: 0;
  font-family: var(--font-mono);
}
.recent-item .icon.vital     { background: rgba(96,165,250,0.15);   color: #93C5FD; }
.recent-item .icon.medication { background: rgba(167,139,250,0.15); color: #C4B5FD; }
.recent-item .icon.hospital  { background: rgba(244,114,182,0.15);  color: #FBCFE8; }
.recent-item .icon.home      { background: rgba(52,211,153,0.15);   color: #6EE7B7; }
.recent-item .icon.progress  { background: rgba(192,132,252,0.15);  color: #DDD6FE; }
.recent-item .icon.bloodtest { background: rgba(239,68,68,0.15);    color: #FCA5A5; }
.recent-item .icon.imaging   { background: rgba(251,146,60,0.15);   color: #FDBA74; }
.recent-item .icon.checkup   { background: rgba(99,102,241,0.15);   color: #A5B4FC; }
.recent-item .icon.vaccination { background: rgba(34,211,238,0.15); color: #67E8F9; }
.recent-item .icon.condition { background: rgba(234,179,8,0.15);    color: #FDE047; }
.recent-item .icon.allergy   { background: rgba(248,113,113,0.15);  color: #FECACA; }
.recent-item .icon.symptom   { background: rgba(244,114,182,0.15);  color: #FBCFE8; }
.recent-item .body { flex: 1; min-width: 0; }
.recent-item .head-row {
  display: flex; align-items: center; gap: var(--s2);
  margin-bottom: 4px;
  flex-wrap: wrap;
}
.recent-item .who {
  font-size: 11px; font-weight: 600;
  padding: 2px 7px; border-radius: var(--r-full);
  background: var(--elevated-2);
  color: var(--text-tertiary);
}
.recent-item .date {
  font-size: 11px; color: var(--text-quiet); font-family: var(--font-mono);
}
.recent-item .chart-num {
  font-size: 10px; font-family: var(--font-mono);
  color: var(--text-tertiary); background: var(--elevated-2);
  padding: 1px 6px; border-radius: var(--r-sm);
}
.recent-item .title {
  font-size: 13px; color: var(--text-primary);
  line-height: 1.4;
}
.recent-item .detail {
  font-size: 12px; color: var(--text-tertiary);
  margin-top: 2px; line-height: 1.5;
}
.recent-photos {
  display: flex; gap: 6px; margin-top: var(--s2);
  flex-wrap: wrap;
}
.photo-thumb {
  width: 60px; height: 60px;
  border-radius: var(--r-sm);
  background: var(--elevated);
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  color: var(--text-tertiary);
  cursor: pointer;
  transition: all var(--t-fast);
  flex-shrink: 0;
  text-decoration: none;
}
.photo-thumb:hover {
  border-color: var(--acc-health);
  color: var(--acc-health);
  background: var(--elevated-2);
}
.photo-thumb-lg { width: 100px; height: 100px; }

/* ─── 개인뷰 ─────────────────────────────────────────── */
.person-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: var(--s5);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  margin-bottom: var(--s4);
  flex-wrap: wrap;
  gap: var(--s3);
}
.person-head .left {
  display: flex; align-items: center; gap: var(--s4);
}
.person-avatar {
  width: 56px; height: 56px;
  border-radius: var(--r-full);
  background: var(--mcolor, var(--acc-health));
  display: flex; align-items: center; justify-content: center;
  color: var(--canvas); font-weight: 600;
  font-family: var(--font-display);
  font-size: 22px;
  flex-shrink: 0;
}
.person-head .name {
  font-family: var(--font-display);
  font-size: 22px; font-weight: 500;
  color: var(--text-primary);
  margin-bottom: 4px;
}
.person-head .meta {
  font-size: 12px; color: var(--text-tertiary);
  font-family: var(--font-mono);
  display: flex; gap: var(--s3);
  flex-wrap: wrap;
}
.person-head .meta span {
  display: inline-flex; align-items: center; gap: 4px;
}
.person-head .meta .label { color: var(--text-quiet); }

.summary-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: var(--s4);
  margin-bottom: var(--s4);
}
@media (max-width: 767px) {
  .summary-grid { grid-template-columns: 1fr; }
}

.summary-card { padding: var(--s5); }
.summary-list {
  display: flex; flex-direction: column; gap: var(--s2);
  font-size: 13px;
}
.summary-list .row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
}
.summary-list .row:last-child { border-bottom: none; }
.summary-list .row .l { color: var(--text-secondary); }
.summary-list .row .r {
  color: var(--text-primary);
  font-family: var(--font-mono); font-size: 12px;
}
.summary-list .empty {
  font-size: 12px; color: var(--text-quiet); text-align: center; padding: var(--s3);
}

/* 차트 영역 */
.chart-card { padding: var(--s5); }
.chart-tabs {
  display: flex; gap: 4px;
  margin-bottom: var(--s3);
  flex-wrap: wrap;
}
.chart-tab {
  padding: 5px 10px;
  font-size: 11px; font-family: var(--font-mono);
  color: var(--text-tertiary);
  background: transparent; border: 1px solid var(--border);
  border-radius: var(--r-sm);
  cursor: pointer; transition: all var(--t-fast);
}
.chart-tab:hover { color: var(--text-primary); }
.chart-tab.active {
  background: var(--elevated); color: var(--text-primary);
  border-color: var(--border-hi);
}
.chart-wrap {
  position: relative;
  height: 220px;
  width: 100%;
}

/* ── 혈액 차트 드롭다운 + 참고치 캡션 (Part 2) ── */
.chart-tabs { align-items: center; }
.chart-select {
  width: auto; max-width: 200px;
  font-size: 12px; padding: 6px 10px;
  font-family: var(--font-mono);
}
.chart-ref {
  font-size: 11px; color: var(--text-quiet);
  font-family: var(--font-mono);
}

/* ── 선택검진 3년 표 (Part 2) ── */
.imaging-table-wrap { overflow-x: auto; }
table.imaging-table {
  width: 100%; border-collapse: collapse; font-size: 12px;
}
table.imaging-table th, table.imaging-table td {
  padding: 7px 10px; text-align: center;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
table.imaging-table thead th {
  font-family: var(--font-mono); font-size: 11px;
  color: var(--text-tertiary); font-weight: 600;
}
table.imaging-table th.exam-col {
  text-align: left; color: var(--text-secondary); font-weight: 500;
  font-family: var(--font-body);
}
table.imaging-table td.exam-col {
  text-align: left; color: var(--text-secondary);
}
.img-cell { color: var(--text-quiet); }
.img-cell.normal { color: var(--text-tertiary); }
.img-cell.abnormal { color: var(--neutral); font-weight: 600; }
.img-cell.has-finding {
  cursor: pointer; text-decoration: underline dotted;
  text-underline-offset: 3px;
}

/* 소견 툴팁 (선택검진 표 공용) */
#img-tip {
  position: fixed; z-index: 200; max-width: 260px;
  background: var(--elevated-2); color: var(--text-primary);
  border: 1px solid var(--border-hi); border-radius: var(--r-sm);
  padding: 8px 10px; font-size: 12px; line-height: 1.45;
  box-shadow: var(--shadow-md); display: none;
  pointer-events: none;
}

/* ─── 카테고리 picker / 폼 모달 ───────────────────────── */
.h-modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(10, 11, 15, 0.7);
  backdrop-filter: blur(8px);
  display: none; align-items: flex-end; justify-content: center;
  z-index: 200;
}
.h-modal-backdrop.open { display: flex; }
@media (min-width: 768px) {
  .h-modal-backdrop { align-items: center; padding: var(--s4); }
}
.h-modal {
  background: var(--surface);
  border: 1px solid var(--border-hi);
  border-radius: var(--r-lg) var(--r-lg) 0 0;
  width: 100%; max-width: 560px;
  max-height: 92vh;
  display: flex; flex-direction: column;
  animation: modalSlideUp var(--t-sheet) cubic-bezier(0.32, 0.72, 0, 1);
}
@media (min-width: 768px) {
  .h-modal { border-radius: var(--r-lg); }
}
@keyframes modalSlideUp {
  from { transform: translateY(20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.h-modal-head {
  padding: var(--s4) var(--s5);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.h-modal-title {
  font-family: var(--font-display);
  font-size: 18px; font-weight: 500;
  color: var(--text-primary);
  display: flex; align-items: center; gap: var(--s2);
}
.h-modal-back {
  font-size: 13px; color: var(--text-tertiary);
  background: transparent; border: none; cursor: pointer;
  margin-right: var(--s2);
  padding: 4px;
}
.h-modal-back:hover { color: var(--text-primary); }
.h-modal-close {
  font-size: 24px; line-height: 1;
  color: var(--text-quiet);
  background: transparent; border: none; cursor: pointer;
  padding: 4px 8px;
}
.h-modal-close:hover { color: var(--text-primary); }
.h-modal-body {
  padding: var(--s5);
  overflow-y: auto;
  flex: 1;
}
.h-modal-foot {
  padding: var(--s4) var(--s5);
  border-top: 1px solid var(--border);
  display: flex; gap: var(--s2); justify-content: flex-end;
}

/* ─── 검색 모달 (Session 10 — hospital_report + home_clinic) ───── */
.search-icon-btn {
  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--r-md); color: var(--text-tertiary);
  transition: all var(--t-fast);
  background: transparent; border: none; cursor: pointer;
}
.search-icon-btn:hover { background: var(--elevated); color: var(--text-primary); }
.search-icon-btn svg { display: block; }

.search-modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(10, 11, 15, 0.7);
  backdrop-filter: blur(8px);
  display: none; align-items: flex-end; justify-content: center;
  z-index: 210;
}
.search-modal-backdrop.open { display: flex; }
@media (min-width: 768px) {
  .search-modal-backdrop { align-items: center; padding: var(--s4); }
}
.search-modal {
  background: var(--surface);
  border: 1px solid var(--border-hi);
  border-radius: var(--r-lg) var(--r-lg) 0 0;
  width: 100%; max-width: 680px;
  max-height: 92vh;
  display: flex; flex-direction: column;
  animation: modalSlideUp var(--t-sheet) cubic-bezier(0.32, 0.72, 0, 1);
}
@media (min-width: 768px) {
  .search-modal { border-radius: var(--r-lg); }
}
.search-modal-head {
  padding: var(--s4) var(--s5);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.search-modal-title {
  font-family: var(--font-display);
  font-size: 18px; font-weight: 500;
  color: var(--text-primary);
}
.search-modal-close {
  font-size: 24px; line-height: 1;
  color: var(--text-quiet);
  background: transparent; border: none; cursor: pointer;
  padding: 4px 8px;
}
.search-modal-close:hover { color: var(--text-primary); }
.search-modal-controls {
  padding: var(--s4) var(--s5) 0;
  display: flex; flex-direction: column; gap: var(--s3);
  flex-shrink: 0;
}
.search-modal-body {
  padding: var(--s3) var(--s5) var(--s5);
  overflow-y: auto;
  flex: 1;
}

/* 멤버 칩 줄 */
.search-member-chips {
  display: flex; gap: 6px; flex-wrap: wrap;
}
.search-chip {
  padding: 5px 11px;
  font-size: 12px; color: var(--text-tertiary);
  background: transparent;
  border: 1px solid var(--border);
  border-radius: var(--r-full);
  cursor: pointer;
  transition: all var(--t-fast);
  display: inline-flex; align-items: center; gap: 6px;
}
.search-chip:hover { color: var(--text-primary); border-color: var(--border-hi); }
.search-chip.active {
  color: var(--text-primary);
  background: var(--acc-health-soft);
  border-color: var(--acc-health);
}
.search-chip .mdot {
  width: 7px; height: 7px; border-radius: 50%;
}

/* 모드 탭 */
.search-mode-tabs {
  display: flex; gap: 2px;
  background: var(--elevated);
  border-radius: var(--r-sm);
  padding: 3px;
  width: fit-content;
}
.search-mode-tab {
  padding: 6px 14px;
  font-size: 12px; font-weight: 500;
  color: var(--text-tertiary);
  background: transparent;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  transition: all var(--t-fast);
}
.search-mode-tab:hover { color: var(--text-primary); }
.search-mode-tab.active {
  background: var(--acc-health);
  color: var(--canvas);
}

/* 인풋 영역 */
.search-input-row {
  display: flex; gap: var(--s2);
  align-items: center;
}
.search-input {
  flex: 1;
  background: var(--canvas);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  padding: 9px 12px;
  font-size: 13px;
  color: var(--text-primary);
  font-family: var(--font-body);
  transition: border-color var(--t-fast);
}
.search-input:focus { border-color: var(--acc-health); outline: none; }
.search-input::placeholder { color: var(--text-quiet); }
.search-input[type="date"] {
  font-family: var(--font-mono);
  font-size: 12px;
  color-scheme: dark;
}
.search-date-sep {
  color: var(--text-quiet);
  font-family: var(--font-mono);
  font-size: 13px;
}

/* 결과 */
.search-hint {
  padding: var(--s7) var(--s4);
  color: var(--text-quiet);
  font-size: 13px;
  text-align: center;
}
.search-count {
  font-size: 11px;
  color: var(--text-quiet);
  font-family: var(--font-mono);
  margin-bottom: var(--s3);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.search-result-item {
  background: var(--elevated);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: var(--s3) var(--s4);
  margin-bottom: var(--s2);
  cursor: pointer;
  transition: all var(--t-fast);
}
.search-result-item:hover {
  border-color: var(--acc-health);
  background: var(--elevated-2);
}
.sr-head {
  display: flex; align-items: center; gap: var(--s2);
  margin-bottom: 4px;
  font-size: 11px;
}
.sr-badge {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 22px; height: 22px; padding: 0 6px;
  border-radius: 5px;
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 600;
  letter-spacing: 0.04em;
}
.sr-badge-hospital {
  background: rgba(239, 68, 68, 0.16);
  color: #fca5a5;
}
.sr-badge-home {
  background: rgba(52, 211, 153, 0.16);
  color: #6ee7b7;
}
.sr-date {
  font-family: var(--font-mono);
  color: var(--text-tertiary);
}
.sr-member {
  font-size: 11px;
  font-weight: 500;
}
.sr-chart-num {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-quiet);
}
.sr-title {
  font-size: 13px;
  color: var(--text-primary);
  font-weight: 500;
  margin-bottom: 2px;
}
.sr-detail {
  font-size: 12px;
  color: var(--text-tertiary);
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.sr-pn-badge {
  display: inline-block;
  margin-top: 6px;
  padding: 2px 8px;
  font-size: 10px;
  font-family: var(--font-mono);
  color: var(--acc-future);
  background: var(--acc-future-soft);
  border-radius: var(--r-full);
}

/* 카테고리 picker */
.cat-list {
  display: grid;
  grid-template-columns: 1fr;
  gap: 4px;
}
.cat-item {
  display: flex; align-items: center; gap: var(--s3);
  padding: var(--s3) var(--s3);
  background: transparent;
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  cursor: pointer;
  transition: all var(--t-fast);
  text-align: left;
  font-family: inherit;
}
.cat-item:hover {
  background: var(--elevated);
  border-color: var(--border-hi);
}
.cat-icon {
  width: 36px; height: 36px;
  border-radius: var(--r-sm);
  display: flex; align-items: center; justify-content: center;
  font-weight: 600; font-size: 13px;
  font-family: var(--font-mono);
  flex-shrink: 0;
  background: var(--elevated);
  color: var(--text-tertiary);
}
.cat-icon.task      { background: rgba(52,211,153,0.15); color: #6EE7B7; }
.cat-icon.vital     { background: rgba(96,165,250,0.15); color: #93C5FD; }
.cat-icon.medication { background: rgba(167,139,250,0.15); color: #C4B5FD; }
.cat-icon.hospital  { background: rgba(244,114,182,0.15); color: #FBCFE8; }
.cat-icon.home      { background: rgba(52,211,153,0.15); color: #6EE7B7; }
.cat-icon.vaccination { background: rgba(34,211,238,0.15); color: #67E8F9; }
.cat-icon.progress  { background: rgba(192,132,252,0.15); color: #DDD6FE; }
.cat-icon.condition { background: rgba(234,179,8,0.15); color: #FDE047; }
.cat-icon.allergy   { background: rgba(248,113,113,0.15); color: #FECACA; }
.cat-icon.momsnote  { background: rgba(244,114,182,0.15); color: #FBCFE8; }
.cat-meta { flex: 1; min-width: 0; }
.cat-name {
  font-size: 13px; font-weight: 500;
  color: var(--text-primary);
}
.cat-desc {
  font-size: 11px; color: var(--text-quiet);
  margin-top: 2px;
}
.cat-arrow {
  font-size: 16px; color: var(--text-quiet);
}

/* 폼 */
.form-group { margin-bottom: var(--s4); }
.form-label {
  display: block; font-size: 11px;
  color: var(--text-secondary);
  text-transform: uppercase; letter-spacing: 0.04em;
  margin-bottom: 6px;
  font-weight: 500;
}
.form-label .req { color: var(--loss); margin-left: 2px; }
.form-input, .form-select, .form-textarea {
  width: 100%;
  background: var(--canvas);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  padding: 10px 12px;
  font-size: 13px;
  color: var(--text-primary);
  font-family: inherit;
  transition: border-color var(--t-fast);
}
.form-input:focus, .form-select:focus, .form-textarea:focus {
  border-color: var(--accent); outline: none;
}
.form-textarea {
  min-height: 70px;
  resize: vertical;
  font-family: inherit;
  line-height: 1.5;
}
.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--s3);
  margin-bottom: var(--s4);
}
@media (max-width: 480px) {
  .form-row { grid-template-columns: 1fr; }
}

/* 멤버 picker (폼 안) */
.mem-picker {
  display: flex; gap: 4px;
  flex-wrap: wrap;
}
.mem-pick-btn {
  padding: 6px 12px;
  font-size: 12px;
  border-radius: var(--r-sm);
  background: var(--canvas);
  border: 1px solid var(--border);
  color: var(--text-tertiary);
  cursor: pointer;
  transition: all var(--t-fast);
  display: flex; align-items: center; gap: 6px;
  font-family: inherit;
}
.mem-pick-btn .mdot { width: 6px; height: 6px; border-radius: 50%; }
.mem-pick-btn:hover { color: var(--text-primary); }
.mem-pick-btn.active {
  background: var(--elevated);
  border-color: var(--border-hi);
  color: var(--text-primary);
}

/* Mom's Note 필드 검증 */
.mn-field {
  border: 1px solid var(--border); border-radius: var(--r-sm);
  padding: var(--s3); margin-bottom: var(--s3);
  transition: border-color var(--t-fast);
}
.mn-field.error { border-color: var(--loss); }
.mn-error-msg {
  font-size: 11px; color: var(--loss);
  margin-top: 4px; display: none;
}
.mn-field.error .mn-error-msg { display: block; }

/* ── 건강검진 폼 (Session 11) ── */
.ck-hint {
  font-size: 11px; color: var(--text-quiet);
  font-weight: 400; text-transform: none; letter-spacing: 0; margin-left: 6px;
}
.ck-grid {
  display: flex; flex-wrap: wrap; gap: var(--s2);
  margin-top: var(--s2);
}
.ck-exam, .ck-blood { display: flex; flex-direction: column; }
.ck-chip {
  font-size: 12px; color: var(--text-secondary);
  padding: 6px 12px; border: 1px solid var(--border);
  border-radius: var(--r-full); background: var(--elevated);
  transition: all var(--t-fast); cursor: pointer; white-space: nowrap;
}
.ck-chip:hover { border-color: var(--border-hi); color: var(--text-primary); }
.ck-exam.on .ck-chip, .ck-blood.on .ck-chip {
  border-color: var(--acc-health); color: var(--acc-health);
  background: var(--acc-health-soft, rgba(52,211,153,0.16));
}
/* 펼쳐진 칩은 한 줄 전체 차지 */
.ck-exam.on, .ck-blood.on {
  width: 100%;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-md); padding: var(--s3);
}
.ck-exam.on .ck-chip, .ck-blood.on .ck-chip { align-self: flex-start; }
.ck-exam-detail {
  display: flex; flex-direction: column; gap: var(--s2); margin-top: var(--s2);
}
.ck-result-pick { display: flex; gap: 6px; }
.ck-res-btn {
  font-size: 12px; color: var(--text-tertiary);
  padding: 5px 14px; border: 1px solid var(--border);
  border-radius: var(--r-full); background: transparent; cursor: pointer;
  transition: all var(--t-fast);
}
.ck-res-btn.active[data-value="normal"] {
  border-color: var(--gain); color: var(--gain); background: var(--gain-soft);
}
.ck-res-btn.active[data-value="abnormal"] {
  border-color: var(--loss); color: var(--loss); background: var(--loss-soft);
}
.ck-finding { font-size: 13px; }
.ck-blood-detail {
  display: flex; align-items: center; gap: var(--s2); margin-top: var(--s2);
}
.ck-blood-detail .ck-value { max-width: 140px; }
.ck-unit { font-size: 12px; color: var(--text-tertiary); font-family: var(--font-mono); }


/* 사진 업로드 */
.photo-strip {
  display: flex; gap: var(--s2);
  flex-wrap: wrap;
  margin-bottom: var(--s2);
}
.photo-preview {
  position: relative;
  width: 80px; height: 80px;
  border-radius: var(--r-sm);
  overflow: hidden;
  border: 1px solid var(--border);
}
.photo-preview img {
  width: 100%; height: 100%; object-fit: cover;
}
.photo-preview-del {
  position: absolute; top: 4px; right: 4px;
  width: 20px; height: 20px;
  border-radius: 50%;
  background: rgba(0,0,0,0.7);
  color: white; font-size: 13px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  line-height: 1;
}
.photo-input-label {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px;
  font-size: 12px;
  background: var(--elevated);
  border: 1px dashed var(--border-hi);
  border-radius: var(--r-sm);
  color: var(--text-tertiary);
  cursor: pointer;
  transition: all var(--t-fast);
}
.photo-input-label:hover {
  border-color: var(--accent); color: var(--text-primary);
}

/* ─── Toast ─────────────────────────────────────────── */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(120px);
  background: var(--surface);
  border: 1px solid var(--border-hi);
  border-radius: var(--r-sm);
  padding: 12px 18px;
  font-size: 13px;
  color: var(--text-primary);
  z-index: 300;
  display: flex; align-items: center; gap: var(--s2);
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  transition: transform var(--t-sheet) cubic-bezier(0.32, 0.72, 0, 1);
  max-width: 90vw;
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.ok    { border-left: 3px solid var(--gain); }
.toast.error { border-left: 3px solid var(--loss); }
.toast.info  { border-left: 3px solid var(--accent); }

/* ─── Home Clinic Detail Popup ─────────────────────── */
.hc-detail-section {
  margin-bottom: var(--s4);
}
.hc-detail-section h4 {
  font-size: 11px; color: var(--text-secondary);
  text-transform: uppercase; letter-spacing: 0.06em;
  margin-bottom: 6px;
  font-weight: 500;
}
.hc-detail-section .content {
  font-size: 13px; line-height: 1.6;
  color: var(--text-primary);
  white-space: pre-wrap;
}
.pn-card {
  background: var(--canvas);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  padding: var(--s3);
  margin-bottom: var(--s2);
}
.pn-card-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 6px;
}
.pn-card-head .date {
  font-size: 11px; color: var(--text-quiet);
  font-family: var(--font-mono);
}
.pn-card-head .day {
  font-size: 11px;
  background: var(--elevated);
  color: var(--text-tertiary);
  padding: 2px 8px;
  border-radius: var(--r-full);
  font-family: var(--font-mono);
}
.pn-card .pn-body {
  font-size: 12px; color: var(--text-secondary);
  line-height: 1.5;
}
.pn-card .pn-body b { color: var(--text-primary); }

/* ─── 뷰 전환 ──────────────────────────────────────── */
.view { display: none; }
.view.active { display: block; }

/* ─── 운동 스케줄 카드 ───────────────────────────── */
.sched-card { margin-bottom: var(--s5); }
.sched-section { padding: var(--s3) 0; border-bottom: 1px solid var(--border); }
.sched-section:last-child { border-bottom: none; padding-bottom: 0; }
.sched-section-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--s2); margin-bottom: var(--s3);
}
.sched-who {
  display: flex; align-items: center; gap: var(--s2);
  font-size: 13px; font-weight: 600; color: var(--text-primary);
}
.sched-who-badge {
  font-size: 11px; padding: 2px 8px; border-radius: var(--r-sm);
  font-family: var(--font-mono); letter-spacing: 0.04em;
}
.sched-who-badge.robi { background: rgba(192, 132, 252, 0.15); color: var(--m-robi); }

<script src="./common.js"></script>

<script>
/* ════════════════════════════════════════════════════════════
 * Health Dashboard — 클라이언트 로직
 * ════════════════════════════════════════════════════════════ */

const DASHBOARD_ID = 'health';
const meta = FamilyOS.getDashboardMeta(DASHBOARD_ID);

/* ─── 상태 ───────────────────────────────────────── */
const state = {
  sheets: {},      // mode=full 응답의 sheets 객체
  members: [],     // 멤버 마스터 (sheets.members 캐싱)
  currentView: 'all', // 'all' | 'dad' | 'mom' | 'robi' | 'dobi'
  currentChartItem: 'AST',
  currentVitalItem: 'weight',
  charts: {},
  isSubmitting: false,
  pendingPhotos: [],
  currentCategory: null,
  modalIsForm: false,   // 입력 폼이 열려 있으면 true. 바깥 탭/Esc 로 닫히지 않게 보호 (Session 11.x)
};

const MEMBER_ORDER = ['dad', 'mom', 'robi', 'dobi'];
const MEMBER_LABELS = { dad: '아빠', mom: '엄마', robi: '로비', dobi: '도비', family: '가족' };
const MEMBER_COLOR_VAR = {
  dad: 'var(--m-dad)', mom: 'var(--m-mom)',
  robi: 'var(--m-robi)', dobi: 'var(--m-dobi)',
  family: 'var(--m-family)'
};

const CATEGORIES = [
  { id: 'task',        name: '할 일',            desc: '가족별 수동 입력 task',                sheet: 'health_tasks',     icon: '✓' },
  { id: 'schedule',    name: '운동 스케줄',       desc: '도비/로비 — 요일 반복 또는 단발 날짜',   sheet: 'schedule',         icon: '🏃' },
  { id: 'vital',       name: 'Vital',           desc: '키 / 몸무게 / 혈압 / 혈당 / 체온',      sheet: 'vital',            icon: 'V' },
  { id: 'medication',  name: 'Medication',      desc: '투약 · 영양제',                        sheet: 'medication',       icon: 'Rx' },
  { id: 'hospital',    name: 'Hospital report', desc: '외부병원 진료 (C/C · P/I · A/P)',      sheet: 'hospital_report',  icon: 'H' },
  { id: 'home',        name: 'Home clinic',     desc: '가정 내 진료 + 사진 첨부 가능',         sheet: 'home_clinic',      icon: 'HC' },
  { id: 'progress',    name: 'Progress note',   desc: '재진료 이어서 (Assessment · Plan)',    sheet: 'progress_note',    icon: 'PN' },
  { id: 'vaccination', name: 'Vaccination',     desc: '예방접종 이력',                        sheet: 'vaccination',      icon: 'VA' },
  { id: 'condition',   name: 'Condition',       desc: '보유질환 추가',                        sheet: 'conditions',       icon: 'C' },
  { id: 'allergy',     name: 'Allergy',         desc: '알레르기 추가',                        sheet: 'allergies',        icon: 'A' },
  { id: 'checkup',     name: '건강검진',         desc: '종합검진 — 선택검사 + 혈액검사 + 복부초음파', sheet: 'healthcheck',  icon: '🩺' },
  { id: 'momsnote',    name: "Mom's Note",      desc: '증상·대상자·기타 — 4가지 필수 입력',  sheet: 'symptom',          icon: '📝' },
];

/* ════════════════════════════════════════════════════════
 * 건강검진 (Session 11) — 상수 정의
 * BLOOD_ITEMS 의 ref(참고치)는 Part 2 트렌드 그래프 음영에도 그대로 재사용.
 * 참고치는 표준 성인 기준(병원마다 상이) — 수정하려면 이 표만 고치면 됨.
 *   ref 형식: { low, high }  (low/high 가 null 이면 그쪽 경계 없음)
 *   성별 다르면: { M:{low,high}, F:{low,high} }
 * ════════════════════════════════════════════════════════ */

// 선택검진 항목 (12)
const CHECKUP_EXAMS = [
  'Brain MRI', '경동맥초음파', '갑상선초음파', '유방초음파',
  '위내시경', '폐CT', '관상동맥CT', '복부MRI',
  '경추MRI', '요추MRI', '대장내시경', '전립선초음파'
];

// 혈액검사 항목 (30) — 단위 + 참고치
const BLOOD_ITEMS = [
  { key: 'WBC',          unit: '10³/µL',  ref: { low: 4.0,  high: 10.0 } },
  { key: 'Hb',           unit: 'g/dL',    ref: { M: { low: 13.0, high: 17.0 }, F: { low: 12.0, high: 16.0 } } },
  { key: 'Plt',          unit: '10³/µL',  ref: { low: 150,  high: 400 } },
  { key: 'AST',          unit: 'U/L',     ref: { low: 0,    high: 40 } },
  { key: 'ALT',          unit: 'U/L',     ref: { low: 0,    high: 40 } },
  { key: 'GGT',          unit: 'U/L',     ref: { M: { low: 11, high: 63 }, F: { low: 8, high: 35 } } },
  { key: 'Total protein',unit: 'g/dL',    ref: { low: 6.0,  high: 8.0 } },
  { key: 'Albumin',      unit: 'g/dL',    ref: { low: 3.5,  high: 5.2 } },
  { key: 'Globulin',     unit: 'g/dL',    ref: { low: 2.0,  high: 3.5 } },
  { key: 'T-Bil',        unit: 'mg/dL',   ref: { low: 0.2,  high: 1.2 } },
  { key: 'ID-Bil',       unit: 'mg/dL',   ref: { low: 0.1,  high: 0.8 } },
  { key: 'D-Bil',        unit: 'mg/dL',   ref: { low: 0.0,  high: 0.4 } },
  { key: 'T-chol',       unit: 'mg/dL',   ref: { low: null, high: 200 } },
  { key: 'TG',           unit: 'mg/dL',   ref: { low: null, high: 150 } },
  { key: 'LDL',          unit: 'mg/dL',   ref: { low: null, high: 130 } },
  { key: 'HDL',          unit: 'mg/dL',   ref: { M: { low: 40, high: null }, F: { low: 50, high: null } } },
  { key: 'Glucose',      unit: 'mg/dL',   ref: { low: 70,   high: 100 } },
  { key: 'HbA1c',        unit: '%',       ref: { low: 4.0,  high: 5.7 } },
  { key: 'TSH',          unit: 'µIU/mL',  ref: { low: 0.4,  high: 4.0 } },
  { key: 'FT4',          unit: 'ng/dL',   ref: { low: 0.7,  high: 1.8 } },
  { key: 'BUN',          unit: 'mg/dL',   ref: { low: 8,    high: 20 } },
  { key: 'Cr',           unit: 'mg/dL',   ref: { M: { low: 0.7, high: 1.3 }, F: { low: 0.5, high: 1.1 } } },
  { key: 'Uric acid',    unit: 'mg/dL',   ref: { M: { low: 3.4, high: 7.0 }, F: { low: 2.4, high: 6.0 } } },
  { key: 'RF',           unit: 'IU/mL',   ref: { low: null, high: 14 } },
  { key: 'AFP',          unit: 'ng/mL',   ref: { low: null, high: 7 } },
  { key: 'CEA',          unit: 'ng/mL',   ref: { low: null, high: 5 } },
  { key: 'PSA',          unit: 'ng/mL',   ref: { low: null, high: 4 } },
  { key: 'CA19-9',       unit: 'U/mL',    ref: { low: null, high: 37 } },
  { key: 'NSE',          unit: 'ng/mL',   ref: { low: null, high: 16.3 } },
  { key: 'Cyfra 21-1',   unit: 'ng/mL',   ref: { low: null, high: 3.3 } }
];
const BLOOD_ITEM_MAP = {};
BLOOD_ITEMS.forEach(b => { BLOOD_ITEM_MAP[b.key] = b; });

/* 멤버 성별에 맞는 참고치 {low,high} 반환 (성별 미상이면 M 기준) */
function refRangeFor(itemKey, gender) {
  const it = BLOOD_ITEM_MAP[itemKey];
  if (!it || !it.ref) return null;
  const r = it.ref;
  if (r.M || r.F) return (gender === 'F') ? r.F : r.M;
  return r;
}

/* ─── 부팅 ───────────────────────────────────────── */
document.getElementById('hdr-mount').innerHTML = FamilyOS.renderHeaderHTML({
  title: 'Health', sub: '가족 건강'
});
document.getElementById('ftr-mount').innerHTML = FamilyOS.renderFooterHTML({
  left: 'Family OS · Health',
  right: 'v0.1.0'
});
document.getElementById('modal-mount').innerHTML = FamilyOS.renderSettingsModalHTML({
  fields: [{ id: DASHBOARD_ID, label: 'Health (건강)' }],
  title: 'Health Web App URL 설정',
  desc: '이 대시보드의 Apps Script Web App URL을 입력하세요. 이 정보는 이 기기 브라우저에만 저장됩니다.'
});
FamilyOS.attachSettingsModal({
  fieldIds: [DASHBOARD_ID],
  onSave: refresh
});

// 새로고침 버튼
document.getElementById('fos-btn-refresh')?.addEventListener('click', refresh);

// 액션 버튼들
document.getElementById('btn-add-record').addEventListener('click', () => openCategoryPicker());
document.getElementById('btn-export-excel').addEventListener('click', () => downloadExcel());

// 빈 상태 안 버튼 위임
document.getElementById('main-mount').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-fos-action]');
  if (!btn) return;
  if (btn.dataset.fosAction === 'open-settings') {
    document.getElementById('fos-btn-settings')?.click();
  } else if (btn.dataset.fosAction === 'retry') {
    refresh();
  }
});

// 모달 닫기 / 뒤로
document.getElementById('h-modal-close').addEventListener('click', closeHModal);
document.getElementById('h-modal-cancel').addEventListener('click', closeHModal);
document.getElementById('h-modal-back').addEventListener('click', () => openCategoryPicker());
document.getElementById('h-modal-submit').addEventListener('click', () => submitForm());
document.getElementById('h-modal-backdrop').addEventListener('click', (e) => {
  // 입력 폼이 열려 있으면 바깥 탭으로 닫지 않음 (실수로 입력값 날아가는 것 방지)
  if (e.target.id === 'h-modal-backdrop' && !state.modalIsForm) closeHModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    const searchBd = document.getElementById('search-modal-backdrop');
    if (searchBd && searchBd.classList.contains('open')) { closeSearchModal(); return; }
    const bd = document.getElementById('h-modal-backdrop');
    // 입력 폼일 때는 Esc 로도 닫지 않음 (× / 취소 버튼으로만 닫기)
    if (bd.classList.contains('open') && !state.modalIsForm) closeHModal();
  }
});

/* ════════════════════════════════════════════════════════
 * 검색 (Session 10)
 * - 대상 시트: hospital_report + home_clinic 만
 * - 키워드: C/C · P/I · A/P 부분 매칭 (progress_note 제외)
 * - 기간: hospital_report.visit_date / home_clinic.date 범위
 * - 결과 클릭 → 기존 detail 모달 (PN은 detail 안에서 자동 노출)
 * ════════════════════════════════════════════════════════ */

const searchState = {
  mode: 'keyword',     // 'keyword' | 'period'
  keyword: '',
  dateStart: '',
  dateEnd: '',
  memberFilter: 'all'  // 'all' | 'dad' | 'mom' | 'robi' | 'dobi'
};

/* 헤더 우측에 🔍 버튼 동적 삽입 (common.js 의 renderHeaderHTML 결과를 건드리지 않고) */
function injectSearchButtonIntoHeader() {
  const actions = document.querySelector('#hdr-mount .hdr-actions');
  if (!actions) return;
  if (document.getElementById('btn-open-search')) return;  // 중복 방지

  const btn = document.createElement('button');
  btn.id = 'btn-open-search';
  btn.className = 'search-icon-btn';
  btn.title = '진료 검색';
  btn.setAttribute('aria-label', '진료 검색');
  btn.innerHTML = `
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="7"></circle>
      <line x1="20" y1="20" x2="16.5" y2="16.5"></line>
    </svg>
  `;
  // 새로고침 버튼 앞에 삽입 (시각적으로 검색 → 새로고침 → 설정 순)
  const refreshBtn = actions.querySelector('#fos-btn-refresh');
  if (refreshBtn) actions.insertBefore(btn, refreshBtn);
  else actions.insertBefore(btn, actions.firstChild);

  btn.addEventListener('click', openSearchModal);
}
// 부팅 직후 헤더에 끼워넣기 (renderHeaderHTML 가 이미 실행된 상태)
injectSearchButtonIntoHeader();

function openSearchModal() {
  // 항상 '전체' + 키워드 모드로 초기화 (사용자 정책)
  searchState.mode = 'keyword';
  searchState.keyword = '';
  searchState.dateStart = '';
  searchState.dateEnd = '';
  searchState.memberFilter = 'all';

  renderSearchMemberChips();
  renderSearchInputArea();
  renderSearchResults([], 'initial');

  document.getElementById('search-modal-backdrop').classList.add('open');
  setTimeout(() => document.getElementById('search-keyword-input')?.focus(), 80);
}

function closeSearchModal() {
  document.getElementById('search-modal-backdrop').classList.remove('open');
}

/* 멤버 칩 렌더 (state.members 기반, 순서 = MEMBER_ORDER + family) */
function renderSearchMemberChips() {
  const wrap = document.getElementById('search-member-chips');
  const order = state.members
    .map(m => m.member_id)
    .filter(id => MEMBER_ORDER.includes(id))
    .sort((a, b) => MEMBER_ORDER.indexOf(a) - MEMBER_ORDER.indexOf(b));

  const items = [{ id: 'all', label: '전체', color: null }];
  order.forEach(id => {
    const m = state.members.find(x => x.member_id === id);
    items.push({
      id,
      label: MEMBER_LABELS[id] || (m && m.name) || id,
      color: MEMBER_COLOR_VAR[id] || null
    });
  });

  wrap.innerHTML = items.map(it => `
    <button class="search-chip ${searchState.memberFilter === it.id ? 'active' : ''}"
            data-member="${escapeHtml(it.id)}">
      ${it.color ? `<span class="mdot" style="background:${it.color}"></span>` : ''}
      ${escapeHtml(it.label)}
    </button>
  `).join('');

  wrap.querySelectorAll('.search-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      searchState.memberFilter = btn.dataset.member;
      wrap.querySelectorAll('.search-chip').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      executeSearch();
    });
  });
}

/* 모드 탭 클릭 핸들러 (정적 DOM 에 한 번만) */
document.querySelectorAll('#search-modal-backdrop .search-mode-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    const mode = tab.dataset.mode;
    if (searchState.mode === mode) return;
    searchState.mode = mode;
    document.querySelectorAll('#search-modal-backdrop .search-mode-tab')
      .forEach(t => t.classList.toggle('active', t.dataset.mode === mode));
    // 모드 전환 시 인풋 값 리셋
    searchState.keyword = '';
    searchState.dateStart = '';
    searchState.dateEnd = '';
    renderSearchInputArea();
    renderSearchResults([], 'initial');
  });
});

/* 인풋 영역 모드별 렌더 */
function renderSearchInputArea() {
  const row = document.getElementById('search-input-row');
  if (searchState.mode === 'keyword') {
    row.innerHTML = `
      <input type="text" class="search-input" id="search-keyword-input"
             placeholder="C/C · P/I · A/P 안에서 검색…" autocomplete="off"
             value="${escapeHtml(searchState.keyword)}">
    `;
    const input = document.getElementById('search-keyword-input');
    let debounceTimer = null;
    input.addEventListener('input', () => {
      searchState.keyword = input.value;
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(executeSearch, 150);
    });
    setTimeout(() => input.focus(), 30);
  } else {
    row.innerHTML = `
      <input type="date" class="search-input" id="search-date-start"
             value="${escapeHtml(searchState.dateStart)}" aria-label="시작일">
      <span class="search-date-sep">~</span>
      <input type="date" class="search-input" id="search-date-end"
             value="${escapeHtml(searchState.dateEnd)}" aria-label="종료일">
    `;
    document.getElementById('search-date-start').addEventListener('change', (e) => {
      searchState.dateStart = e.target.value;
      executeSearch();
    });
    document.getElementById('search-date-end').addEventListener('change', (e) => {
      searchState.dateEnd = e.target.value;
      executeSearch();
    });
  }
}

/* 실제 검색 */
function executeSearch() {
  const hospital = state.sheets.hospital_report || [];
  const home = state.sheets.home_clinic || [];

  const memberMatch = (row) =>
    searchState.memberFilter === 'all' || row.member_id === searchState.memberFilter;

  const results = [];

  if (searchState.mode === 'keyword') {
    const kw = (searchState.keyword || '').trim().toLowerCase();
    if (!kw) {
      renderSearchResults([], 'initial');
      return;
    }
    const fieldMatch = (row) => {
      const fields = [row.chief_complaint, row.present_illness, row.assessment_plan];
      return fields.some(f => f && String(f).toLowerCase().includes(kw));
    };
    hospital.forEach(r => {
      if (memberMatch(r) && fieldMatch(r)) results.push({ sheet: 'hospital_report', row: r });
    });
    home.forEach(r => {
      if (memberMatch(r) && fieldMatch(r)) results.push({ sheet: 'home_clinic', row: r });
    });
  } else {
    // 기간 모드
    const s = (searchState.dateStart || '').trim();
    const e = (searchState.dateEnd || '').trim();
    if (!s && !e) {
      renderSearchResults([], 'initial');
      return;
    }
    if (s && e && s > e) {
      renderSearchResults([], 'invalid_range');
      return;
    }
    const dateMatch = (row, dateField) => {
      const d = String(row[dateField] || '').slice(0, 10);
      if (!d) return false;
      if (s && d < s) return false;
      if (e && d > e) return false;
      return true;
    };
    hospital.forEach(r => {
      if (memberMatch(r) && dateMatch(r, 'visit_date')) results.push({ sheet: 'hospital_report', row: r });
    });
    home.forEach(r => {
      if (memberMatch(r) && dateMatch(r, 'date')) results.push({ sheet: 'home_clinic', row: r });
    });
  }

  // 최신순 정렬 (날짜 desc)
  results.sort((a, b) => {
    const da = String(a.sheet === 'hospital_report' ? a.row.visit_date : a.row.date || '').slice(0, 10);
    const db = String(b.sheet === 'hospital_report' ? b.row.visit_date : b.row.date || '').slice(0, 10);
    return db.localeCompare(da);
  });

  renderSearchResults(results, 'ok');
}

/* 결과 렌더 */
function renderSearchResults(results, status) {
  const body = document.getElementById('search-modal-body');

  if (status === 'initial') {
    const msg = searchState.mode === 'keyword'
      ? '키워드를 입력하면 결과가 표시됩니다.'
      : '시작일과 종료일 중 하나 이상을 선택하세요.';
    body.innerHTML = `<div class="search-hint">${escapeHtml(msg)}</div>`;
    return;
  }
  if (status === 'invalid_range') {
    body.innerHTML = `<div class="search-hint">시작일이 종료일보다 늦습니다.</div>`;
    return;
  }
  if (!results || results.length === 0) {
    body.innerHTML = `<div class="search-hint">검색 결과가 없습니다.</div>`;
    return;
  }

  const itemsHtml = results.map(({ sheet, row }) => renderSearchResultItem(sheet, row)).join('');
  body.innerHTML = `
    <div class="search-count">${results.length}건</div>
    ${itemsHtml}
  `;

  body.querySelectorAll('.search-result-item').forEach(item => {
    item.addEventListener('click', () => {
      const sheet = item.dataset.sheet;
      const rid = item.dataset.recordId;
      if (!rid) return;
      closeSearchModal();
      // backdrop close 애니메이션 끝난 뒤 detail 열기 (z-index 같지만 깔끔하게)
      setTimeout(() => {
        if (sheet === 'hospital_report') openHospitalReportDetail(rid);
        else if (sheet === 'home_clinic') openHomeClinicDetail(rid);
      }, 120);
    });
  });
}

function renderSearchResultItem(sheet, row) {
  const m = state.members.find(x => x.member_id === row.member_id);
  const who = m ? (MEMBER_LABELS[row.member_id] || m.name) : (row.member_id || '');
  const isHospital = sheet === 'hospital_report';
  const date = isHospital ? row.visit_date : row.date;
  const ymd = String(date || '').slice(0, 10);

  const title = isHospital
    ? ([row.hospital, row.department].filter(Boolean).join(' · ') || '병원진료')
    : (row.chief_complaint || '가정진료');

  // 본문 미리보기: C/C 가 title 과 중복이 아니면 C/C, 아니면 P/I 또는 A/P
  let detail = '';
  if (isHospital) {
    detail = row.chief_complaint || row.present_illness || row.assessment_plan || '';
  } else {
    detail = row.present_illness || row.assessment_plan || '';
  }

  // 자식 PN 개수 표시
  const pnCount = (state.sheets.progress_note || [])
    .filter(p => p.parent_record_id === row.record_id).length;

  return `
    <div class="search-result-item"
         data-sheet="${escapeHtml(sheet)}"
         data-record-id="${escapeHtml(row.record_id || '')}">
      <div class="sr-head">
        <span class="sr-badge sr-badge-${isHospital ? 'hospital' : 'home'}">${isHospital ? 'H' : 'HC'}</span>
        <span class="sr-date">${escapeHtml(ymd || '날짜 없음')}</span>
        <span class="sr-member" style="color:${MEMBER_COLOR_VAR[row.member_id] || 'var(--text-tertiary)'}">${escapeHtml(who)}</span>
        ${row.record_id ? `<span class="sr-chart-num">${escapeHtml(row.record_id)}</span>` : ''}
      </div>
      <div class="sr-title">${escapeHtml(title)}</div>
      ${detail ? `<div class="sr-detail">${escapeHtml(detail)}</div>` : ''}
      ${pnCount > 0 ? `<span class="sr-pn-badge">경과 ${pnCount}건</span>` : ''}
    </div>
  `;
}

/* ─── 데이터 로드 ──────────────────────────────────── */
async function refresh() {
  const mount = document.getElementById('main-mount');

  if (!FamilyOS.getWebAppUrl(DASHBOARD_ID)) {
    mount.innerHTML = FamilyOS.renderUnsetStateHTML();
    FamilyOS.setLastSync('—');
    return;
  }

  mount.innerHTML = FamilyOS.renderLoadingStateHTML();
  FamilyOS.setLastSync('동기화 중…');

  try {
    const data = await FamilyOS.fetchDashboardData(DASHBOARD_ID, 'full');
    state.sheets = data.sheets || {};
    state.members = state.sheets.members || [];
    renderMemberTabs();
    renderView();
    FamilyOS.setSyncedNow();
  } catch (err) {
    console.error('[health] fetch failed:', err);
    mount.innerHTML = FamilyOS.renderErrorStateHTML(err.message, { retryId: DASHBOARD_ID });
    FamilyOS.setLastSync('동기화 실패');
  }
}

/* ─── 멤버 탭 ───────────────────────────────────── */
function renderMemberTabs() {
  const tabs = document.getElementById('member-tabs');
  const order = state.members
    .map(m => m.member_id)
    .filter(id => MEMBER_ORDER.includes(id))
    .sort((a, b) => MEMBER_ORDER.indexOf(a) - MEMBER_ORDER.indexOf(b));

  let html = '<button class="health-tab" data-view="all">전체</button>';
  order.forEach(id => {
    const m = state.members.find(x => x.member_id === id);
    if (!m) return;
    html += `<button class="health-tab" data-view="${id}">
      <span class="mdot" style="background:${MEMBER_COLOR_VAR[id]}"></span>${escapeHtml(MEMBER_LABELS[id] || m.name)}
    </button>`;
  });
  tabs.innerHTML = html;

  tabs.querySelectorAll('.health-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      state.currentView = btn.dataset.view;
      tabs.querySelectorAll('.health-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderView();
    });
  });
  // 현재 뷰 활성화
  const cur = tabs.querySelector(`[data-view="${state.currentView}"]`);
  if (cur) cur.classList.add('active');
  else tabs.querySelector('[data-view="all"]')?.classList.add('active');
}

  setTimeout(() => {

      renderVitalChart(state.currentView);

}

function renderMemberCardHtml(m) {
  const id = m.member_id;
  const age = computeAge(m.birth_date);
  const status = computeMemberStatus(id);
  const statusColor = status === 'bad' ? 'var(--st-bad)' :
                      status === 'warn' ? 'var(--st-warn)' : 'var(--st-ok)';
  const latestH = getLatestVital(id, 'height');
  const latestW = getLatestVital(id, 'weight');
  const hcm = latestH ? parseFloat(latestH.value) : (m.height_cm ? parseFloat(m.height_cm) : null);
  const wkg = latestW ? parseFloat(latestW.value) : null;
  const bmi = (hcm && wkg) ? (wkg / Math.pow(hcm/100, 2)).toFixed(1) : null;

  const activeConds = (state.sheets.conditions || [])
    .filter(c => c.member_id === id && c.status !== 'resolved');
  const condChips = activeConds.slice(0, 3).map(c =>
    `<span class="cond-chip">${escapeHtml(c.condition_name)}</span>`
  ).join('');
  const moreCount = activeConds.length > 3 ? `<span class="cond-chip">+${activeConds.length - 3}</span>` : '';

  return `
    <div class="member-card" data-member-id="${id}" style="--mcolor: ${MEMBER_COLOR_VAR[id]}">
      <div class="top">
        <div class="name">${escapeHtml(MEMBER_LABELS[id])}</div>
        <div class="status-dot" style="background: ${statusColor}" title="status: ${status}"></div>
      </div>
      <div class="meta">${age ? age + '세' : ''}${m.gender ? ' · ' + (m.gender === 'M' ? '남' : '여') : ''}${m.blood_type ? ' · ' + m.blood_type : ''}</div>
      <div class="bmi-row">
        ${wkg ? `<div><span class="label">체중</span><span class="val">${wkg}kg</span></div>` : ''}
        ${bmi ? `<div><span class="label">BMI</span><span class="val">${bmi}</span></div>` : ''}
      </div>
      ${condChips || moreCount ? `<div class="conds">${condChips}${moreCount}</div>` : ''}

  `;
}
