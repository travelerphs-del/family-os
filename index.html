<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A0B0F">

  <title>Family OS</title>

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="apple-touch-icon" href="./icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Family OS">

  <!-- 공통 디자인 토큰 -->
  <link rel="stylesheet" href="./design-tokens.css">

  <style>
    body {
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
      overflow-x: hidden;
    }
    .app {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 var(--s6);
    }
    @media (max-width: 767px) { .app { padding: 0 var(--s4); } }

    /* ─── 헤더 (common.js 출력과 짝) ─────────────────────────── */
    header.hdr {
      display: flex; align-items: center; justify-content: space-between;
      padding: var(--s6) 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: var(--s7);
    }
    @media (max-width: 767px) {
      header.hdr { padding: var(--s4) 0; margin-bottom: var(--s5); }
    }
    .brand { display: flex; align-items: baseline; gap: var(--s3); }
    .brand-title {
      font-family: var(--font-display); font-weight: 500;
      font-size: 24px; letter-spacing: -0.01em; color: var(--text-primary);
    }
    .brand-sub {
      font-size: 12px; color: var(--text-quiet);
      letter-spacing: 0.05em; text-transform: uppercase;
    }
    @media (max-width: 480px) {
      .brand-title { font-size: 20px; }
      .brand-sub { display: none; }
    }
    .hdr-actions { display: flex; gap: var(--s2); align-items: center; }
    .icon-btn {
      width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      border-radius: var(--r-md); color: var(--text-tertiary);
      transition: all var(--t-fast); cursor: pointer;
    }
    .icon-btn:hover { background: var(--elevated); color: var(--text-primary); }
    .icon-btn svg { display: block; }
    .last-sync {
      font-size: 11px; color: var(--text-quiet); font-family: var(--font-mono);
      padding-right: var(--s2);
    }
    @media (max-width: 480px) { .last-sync { display: none; } }

    /* ─── 카드 그리드 ─────────────────────────────────────────── */
    .cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--s5);
      margin-bottom: var(--s7);
    }
    @media (max-width: 767px) {
      .cards { grid-template-columns: 1fr; gap: var(--s4); }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: var(--s5);
      position: relative;
      overflow: hidden;
      transition: border-color var(--t-fast), transform var(--t-fast);
      animation: cardIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) backwards;
    }
    .card:nth-child(1) { animation-delay: 0.05s; }
    .card:nth-child(2) { animation-delay: 0.10s; }
    .card:nth-child(3) { animation-delay: 0.15s; }
    .card:nth-child(4) { animation-delay: 0.20s; }
    .card:nth-child(5) { animation-delay: 0.25s; }
    /* Travel 카드는 5번째이며 가로 2칸 차지 (비대칭) */
    .card[data-id="travel"] { grid-column: 1 / -1; }
    @media (max-width: 767px) {
      .card[data-id="travel"] { grid-column: auto; }
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: var(--card-accent);
      opacity: 0.85;
    }
    .card[data-id="wealth"]  { --card-accent: var(--acc-wealth); }
    .card[data-id="expense"] { --card-accent: var(--acc-expense); }
    .card[data-id="health"]  { --card-accent: var(--acc-health); }
    .card[data-id="future"]  { --card-accent: var(--acc-future); }
    .card[data-id="travel"]  { --card-accent: var(--acc-travel); }
    .card-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: var(--s5);
    }
    .card-label { display: flex; align-items: center; gap: var(--s2); }
    .card-dot {
      width: 6px; height: 6px; border-radius: var(--r-full);
      background: var(--card-accent);
    }
    .card-title {
      font-size: 11px; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--text-secondary);
    }
    .card-kr { font-size: 10px; color: var(--text-quiet); letter-spacing: 0.04em; }
    .card-open {
      color: var(--text-quiet); transition: color var(--t-fast);
      padding: var(--s1); margin: calc(-1 * var(--s1));
      border-radius: var(--r-sm);
    }
    .card-open:hover { color: var(--card-accent); }

    /* ─── 카드 본문 공통 ─────────────────────────────────────── */
    .hero-num {
      display: flex; align-items: baseline; gap: var(--s3);
      flex-wrap: wrap; margin-bottom: var(--s3);
    }
    .hero-num-value {
      font-family: var(--font-display); font-weight: 500;
      font-size: 36px; letter-spacing: -0.02em;
      color: var(--text-primary); font-variant-numeric: tabular-nums;
      line-height: 1.1;
    }
    @media (max-width: 480px) { .hero-num-value { font-size: 28px; } }
    .hero-num-unit {
      font-size: 13px; color: var(--text-tertiary);
      font-family: var(--font-body); font-weight: 500;
    }
    .hero-num-delta {
      font-family: var(--font-mono); font-size: 12px; font-weight: 500;
    }
    .gain  { color: var(--gain); }
    .loss  { color: var(--loss); }
    .muted { color: var(--text-quiet); }
    .card-meta {
      font-size: 11px; color: var(--text-quiet);
      margin-top: var(--s4); padding-top: var(--s3);
      border-top: 1px dashed var(--border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .card-meta .time { font-family: var(--font-mono); }

    /* ─── Wealth 카드 펼치기 ──────────────────────────────────── */
    details.wealth-expand { margin-top: var(--s3); }
    details.wealth-expand summary {
      list-style: none; cursor: pointer;
      font-size: 11px; color: var(--text-tertiary);
      display: inline-flex; align-items: center; gap: var(--s1);
      padding: var(--s1) 0; user-select: none;
    }
    details.wealth-expand summary::-webkit-details-marker { display: none; }
    details.wealth-expand summary:hover { color: var(--text-primary); }
    details.wealth-expand summary .chev { transition: transform var(--t-fast); }
    details.wealth-expand[open] summary .chev { transform: rotate(180deg); }
    .breakdown-grid {
      display: grid; grid-template-columns: 1fr; gap: var(--s3);
      margin-top: var(--s3); padding-top: var(--s3);
      border-top: 1px solid var(--border);
    }
    .bd-row {
      display: grid; grid-template-columns: 90px 1fr;
      gap: var(--s3); font-size: 12px;
    }
    .bd-name { color: var(--text-secondary); font-weight: 500; }
    .bd-stats {
      display: flex; gap: var(--s3); align-items: baseline;
      flex-wrap: wrap; font-family: var(--font-mono); font-size: 11px;
    }
    .bd-weight { color: var(--text-primary); font-weight: 600; }
    .bd-delta { font-size: 10px; }

    /* ─── Expense 카드 ───────────────────────────────────────── */
    .cat-chips {
      display: flex; gap: var(--s2); flex-wrap: wrap; margin-top: var(--s4);
    }
    .cat-chip {
      background: var(--elevated); border: 1px solid var(--border);
      border-radius: var(--r-full); padding: 4px 10px;
      font-size: 11px; color: var(--text-secondary);
      display: inline-flex; align-items: baseline; gap: 6px;
    }
    .cat-chip .pct {
      font-family: var(--font-mono);
      color: var(--text-tertiary); font-size: 10px;
    }

    /* ─── Health 카드 ────────────────────────────────────────── */
    .health-list {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: var(--s3); margin-top: var(--s2);
    }
    @media (max-width: 480px) { .health-list { grid-template-columns: 1fr; } }
    .health-row {
      display: flex; align-items: center; gap: var(--s3); padding: var(--s2) 0;
    }
    .dot { width: 8px; height: 8px; border-radius: var(--r-full); flex-shrink: 0; }
    .dot-ok   { background: var(--gain); }
    .dot-warn { background: var(--neutral); box-shadow: 0 0 0 4px var(--gain-soft); }
    .dot-bad  { background: var(--loss); box-shadow: 0 0 0 4px var(--loss-soft); }
    .dot-unknown { background: var(--text-quiet); }
    .health-name { font-size: 13px; color: var(--text-primary); font-weight: 500; }
    .health-status {
      font-size: 10px; color: var(--text-tertiary);
      text-transform: uppercase; letter-spacing: 0.06em; margin-left: auto;
    }

    /* ─── Future 카드 (progress bar) ─────────────────────────── */
    .progress-track {
      width: 100%; height: 6px;
      background: var(--elevated); border-radius: var(--r-full);
      overflow: hidden; margin-top: var(--s4);
    }
    .progress-fill {
      height: 100%; background: var(--card-accent);
      border-radius: var(--r-full); transition: width var(--t-slow);
    }
    .progress-label {
      display: flex; justify-content: space-between; align-items: baseline;
      font-size: 11px; color: var(--text-tertiary);
      margin-top: var(--s2); font-family: var(--font-mono);
    }
    .milestone {
      margin-top: var(--s3); padding-top: var(--s3);
      border-top: 1px solid var(--border); font-size: 12px;
    }
    .milestone-label {
      color: var(--text-quiet); font-size: 10px;
      text-transform: uppercase; letter-spacing: 0.06em;
      margin-bottom: 2px;
    }
    .milestone-text { color: var(--text-primary); font-weight: 500; }
    .milestone-date {
      color: var(--text-tertiary); font-family: var(--font-mono);
      font-size: 11px; margin-left: var(--s2);
    }

    /* ─── 빈 상태 (common.js 출력과 짝) ──────────────────────── */
    .state-empty {
      padding: var(--s4) 0;
      color: var(--text-quiet); font-size: 13px;
      display: flex; flex-direction: column; gap: var(--s2);
      align-items: flex-start;
    }
    .state-empty .ico {
      width: 32px; height: 32px;
      border-radius: var(--r-md); background: var(--elevated);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: var(--s2); color: var(--text-tertiary);
    }
    .state-empty .msg { color: var(--text-tertiary); font-size: 12px; }
    .state-empty button {
      font-size: 12px; color: var(--card-accent);
      padding: 6px 10px; border: 1px solid var(--border);
      border-radius: var(--r-sm); background: transparent;
      margin-top: var(--s2); transition: all var(--t-fast); cursor: pointer;
    }
    .state-empty button:hover {
      border-color: var(--card-accent); background: var(--elevated);
    }
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid var(--elevated-2);
      border-top-color: var(--card-accent);
      border-radius: 50%; animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── Tasks 섹션 ─────────────────────────────────────────── */
    .tasks-section { margin-bottom: var(--s8); }
    .tasks-head {
      display: flex; align-items: baseline; gap: var(--s3);
      margin-bottom: var(--s4);
    }
    .tasks-head h2 {
      font-family: var(--font-display); font-weight: 500;
      font-size: 18px; color: var(--text-primary); letter-spacing: -0.01em;
    }
    .tasks-head .count { font-size: 12px; color: var(--text-quiet); font-family: var(--font-mono); }
    .tasks-list {
      list-style: none; display: flex; flex-direction: column; gap: 1px;
      background: var(--border); border-radius: var(--r-md);
      overflow: hidden; border: 1px solid var(--border);
    }
    .task-item {
      background: var(--surface);
      padding: var(--s4) var(--s5);
      display: flex; align-items: center; gap: var(--s4);
      cursor: pointer; transition: background var(--t-fast);
    }
    .task-item:hover { background: var(--elevated); }
    .task-urgency { width: 8px; height: 8px; border-radius: var(--r-full); flex-shrink: 0; }
    .u-info { background: var(--info); }
    .u-warn { background: var(--neutral); }
    .u-bad  { background: var(--loss); animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .task-text { flex: 1; font-size: 13px; color: var(--text-primary); }
    .task-tag {
      font-size: 10px; color: var(--text-quiet);
      text-transform: uppercase; letter-spacing: 0.06em;
      padding: 2px 8px; border: 1px solid var(--border);
      border-radius: var(--r-full);
    }
    .task-due {
      font-size: 11px; color: var(--text-tertiary); font-family: var(--font-mono);
    }
    .task-empty {
      background: var(--surface); padding: var(--s6);
      text-align: center; color: var(--text-quiet); font-size: 13px;
      border: 1px dashed var(--border); border-radius: var(--r-md);
    }

    /* ─── 설정 모달 (common.js 출력과 짝) ────────────────────── */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(10, 11, 15, 0.7);
      backdrop-filter: blur(8px);
      display: none; align-items: center; justify-content: center;
      z-index: 100; padding: var(--s4);
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--surface); border: 1px solid var(--border-hi);
      border-radius: var(--r-lg); padding: var(--s6);
      width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto;
      animation: modalIn 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    }
    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.96) translateY(8px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
    .modal-title {
      font-family: var(--font-display); font-size: 20px; font-weight: 500;
      margin-bottom: var(--s2);
    }
    .modal-desc {
      font-size: 12px; color: var(--text-tertiary); line-height: 1.6;
      margin-bottom: var(--s5);
    }
    .modal-field { margin-bottom: var(--s4); }
    .modal-label {
      display: flex; align-items: center; gap: var(--s2);
      font-size: 11px; color: var(--text-secondary);
      text-transform: uppercase; letter-spacing: 0.06em;
      margin-bottom: var(--s2);
    }
    .modal-input {
      width: 100%; background: var(--canvas);
      border: 1px solid var(--border); border-radius: var(--r-sm);
      padding: 10px 12px; font-size: 12px; color: var(--text-primary);
      font-family: var(--font-mono); transition: border-color var(--t-fast);
    }
    .modal-input:focus { border-color: var(--accent); }
    .modal-input::placeholder { color: var(--text-quiet); }
    .modal-actions {
      display: flex; gap: var(--s2); justify-content: flex-end; margin-top: var(--s5);
    }
    .btn {
      padding: 10px 18px; border-radius: var(--r-sm);
      font-size: 13px; font-weight: 500;
      transition: all var(--t-fast); border: 1px solid transparent; cursor: pointer;
    }
    .btn-primary { background: var(--accent); color: var(--canvas); }
    .btn-primary:hover { background: #F5D175; }
    .btn-ghost {
      background: transparent; color: var(--text-secondary);
      border-color: var(--border);
    }
    .btn-ghost:hover { border-color: var(--border-hi); color: var(--text-primary); }

    /* ─── 푸터 ──────────────────────────────────────────────── */
    footer.ftr {
      padding: var(--s5) 0 var(--s8);
      border-top: 1px solid var(--border);
      font-size: 11px; color: var(--text-quiet);
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: var(--s2);
    }
    footer.ftr .ftr-r { font-family: var(--font-mono); }

    /* 카드 전체 클릭 영역 — Session 5.3: 클릭 영역 확장 + 키보드 접근성 */
    .card { cursor: pointer; }
    .card a.card-link-overlay {
      position: absolute; inset: 0; z-index: 1;
      pointer-events: none;
      border-radius: var(--r-lg);
      outline: 0;
    }
    .card a.card-link-overlay:focus-visible {
      outline: 2px solid var(--card-accent);
      outline-offset: 2px;
    }
    .card .card-interactive { position: relative; z-index: 2; }
    .card:hover { border-color: var(--border-hi); }
    .card:active { transform: scale(0.998); }

    /* ─── Travel 카드 (5번째, 2x2 슬롯) ─────────────────────── */
    .travel-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--s3);
    }
    @media (max-width: 480px) {
      .travel-grid { grid-template-columns: 1fr; }
    }
    .travel-slot {
      background: var(--canvas);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: var(--s3) var(--s4);
      display: flex; align-items: center; justify-content: space-between;
      gap: var(--s3);
      transition: border-color var(--t-fast);
      min-height: 56px;
    }
    .travel-slot:hover { border-color: var(--border-hi); }
    .travel-slot .city {
      font-family: var(--font-display);
      font-size: 15px;
      color: var(--text-primary);
      letter-spacing: -0.01em;
      line-height: 1.2;
    }
    .travel-slot .sub {
      font-size: 10px; color: var(--text-quiet);
      margin-top: 2px;
      font-family: var(--font-mono);
    }
    .travel-slot .planned {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--acc-travel);
      padding: 3px 9px;
      background: var(--acc-travel-soft);
      border-radius: var(--r-full);
      flex-shrink: 0;
    }
    .travel-slot.empty {
      border: 1px dashed var(--border);
      background: transparent;
      color: var(--text-quiet);
      font-size: 12px;
      justify-content: center;
      cursor: pointer;
    }
    .travel-slot.empty:hover {
      border-color: var(--acc-travel);
      color: var(--acc-travel);
    }
    .travel-meta {
      margin-top: var(--s3);
      font-size: 11px; color: var(--text-quiet);
      font-family: var(--font-mono);
    }
  </style>
</head>

<body>
  <div class="app">

    <!-- 헤더 (common.js 마운트) -->
    <div id="hdr-mount"></div>

    <!-- 메인 -->
    <main>
      <section class="cards" id="cards">
        <article class="card" data-id="wealth" id="card-wealth"></article>
        <article class="card" data-id="expense" id="card-expense"></article>
        <article class="card" data-id="health" id="card-health"></article>
        <article class="card" data-id="future" id="card-future"></article>
        <article class="card" data-id="travel" id="card-travel"></article>
      </section>

      <section class="tasks-section">
        <div class="tasks-head">
          <h2>할 일</h2>
          <span class="count" id="task-count">—</span>
        </div>
        <ul class="tasks-list" id="tasks-list"></ul>
        <div class="task-empty" id="task-empty" style="display:none;">
          처리할 항목이 없거나, Web App URL이 아직 설정되지 않았어요.
        </div>
      </section>
    </main>

    <!-- 푸터 (common.js 마운트) -->
    <div id="ftr-mount"></div>
  </div>

  <!-- 모달 (common.js 마운트) -->
  <div id="modal-mount"></div>

  <!-- 공통 모듈 -->
  <script src="./common.js"></script>

  <script>
  /* ════════════════════════════════════════════════════════
   * Family OS — 메인 허브 페이지 로직
   * 메인은 4개 카드를 동시에 관리 (서브 대시보드는 자기 1개만)
   * ════════════════════════════════════════════════════════ */

  const { DASHBOARDS, fmtKRWFull, fmtPct, fmtPctNoSign, deltaClass, timeAgo, escapeHtml } = FamilyOS;

  /* ─── 헤더/푸터/모달 마운트 ───────────────────────────── */
  document.getElementById('hdr-mount').innerHTML = FamilyOS.renderHeaderHTML({
    title: 'Family OS',
    sub: '통합 대시보드'
  });
  document.getElementById('ftr-mount').innerHTML = FamilyOS.renderFooterHTML({
    left: 'Family OS · Phase 1 · Hub',
    right: 'v0.1.0'
  });
  document.getElementById('modal-mount').innerHTML = FamilyOS.renderSettingsModalHTML();
  FamilyOS.attachSettingsModal({ onSave: refreshAll });
  document.getElementById('fos-btn-refresh').addEventListener('click', refreshAll);

  /* ─── 상태 ────────────────────────────────────────────── */
  const state = {
    data:   { wealth: null, expense: null, health: null, future: null, travel: null },
    status: { wealth: 'unset', expense: 'unset', health: 'unset', future: 'unset', travel: 'unset' },
    error:  { wealth: null,   expense: null,   health: null,   future: null,   travel: null }
  };

  /* ─── 데이터 fetch ───────────────────────────────────── */
  async function refreshOne(id) {
    if (!FamilyOS.getWebAppUrl(id)) {
      state.status[id] = 'unset';
      renderCard(id);
      return;
    }
    state.status[id] = 'loading';
    renderCard(id);
    try {
      state.data[id] = await FamilyOS.fetchDashboardData(id, 'summary');
      state.status[id] = 'ok';
      state.error[id] = null;
    } catch (err) {
      console.error('[' + id + '] fetch failed:', err);
      state.error[id] = err.message;
      state.status[id] = err.message === 'UNSET' ? 'unset' : 'error';
    }
    renderCard(id);
  }

  async function refreshAll() {
    FamilyOS.setLastSync('동기화 중…');
    await Promise.allSettled(DASHBOARDS.map(d => refreshOne(d.id)));
    FamilyOS.setSyncedNow();
    // Session 5.1 — Wealth 도착 후 Future 카드를 한 번 더 그려 진행률 결합 표시
    if (state.status.future === 'ok') renderCard('future');
    renderTasks();
  }

  /* ─── 카드 렌더링 ────────────────────────────────────── */
  function renderCard(id) {
    const el = document.getElementById('card-' + id);
    const meta = FamilyOS.getDashboardMeta(id);
    const status = state.status[id];

    let bodyHtml = '';
    if (status === 'unset')        bodyHtml = FamilyOS.renderUnsetStateHTML();
    else if (status === 'loading') bodyHtml = FamilyOS.renderLoadingStateHTML();
    else if (status === 'error')   bodyHtml = FamilyOS.renderErrorStateHTML(state.error[id], { retryId: id });
    else if (status === 'ok') {
      switch (id) {
        case 'wealth':  bodyHtml = renderWealth(state.data[id]); break;
        case 'expense': bodyHtml = renderExpense(state.data[id]); break;
        case 'health':  bodyHtml = renderHealth(state.data[id]); break;
        case 'future':  bodyHtml = renderFuture(state.data[id]); break;
        case 'travel':  bodyHtml = renderTravel(state.data[id]); break;
      }
    }

    const updatedAt = (status === 'ok' && state.data[id]) ? state.data[id].updated_at : null;

    el.innerHTML = `
      <a class="card-link-overlay" href="${escapeHtml(meta.href)}" target="_blank" rel="noopener" aria-label="${escapeHtml(meta.label)} 대시보드 열기"></a>
      <div class="card-interactive">
        <div class="card-head">
          <div class="card-label">
            <span class="card-dot"></span>
            <span class="card-title">${escapeHtml(meta.label)}</span>
            <span class="card-kr">· ${escapeHtml(meta.kr)}</span>
          </div>
          <span class="card-open" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M7 17L17 7"></path><path d="M7 7h10v10"></path>
            </svg>
          </span>
        </div>
        ${bodyHtml}
        ${status === 'ok' ? `
          <div class="card-meta">
            <span>${escapeHtml(meta.kr)} 자세히 →</span>
            <span class="time" title="${escapeHtml(updatedAt || '')}">${timeAgo(updatedAt)}</span>
          </div>` : ''}
      </div>
    `;
  }

  /* ─── 카드별 본문 렌더링 ────────────────────────────── */
  function renderWealth(data) {
    const k = data.kpi || {};
    const bd = k.breakdown || {};
    const rows = [
      { name: '국내주식', d: bd.domestic_stock },
      { name: '해외주식', d: bd.foreign_stock },
      { name: '부동산',   d: bd.realestate },
      { name: '현금',     d: bd.cash }
    ].filter(r => r.d);

    const rowsHtml = rows.map(r => `
      <div class="bd-row">
        <div class="bd-name">${escapeHtml(r.name)}</div>
        <div class="bd-stats">
          <span class="bd-weight">${fmtPctNoSign(r.d.weight_pct)}</span>
          ${r.d.mom_pct != null ? `<span class="bd-delta ${deltaClass(r.d.mom_pct)}">MoM ${fmtPct(r.d.mom_pct)}</span>` : ''}
          ${r.d.yoy_pct != null ? `<span class="bd-delta ${deltaClass(r.d.yoy_pct)}">YoY ${fmtPct(r.d.yoy_pct)}</span>` : ''}
        </div>
      </div>
    `).join('');

    return `
      <div class="hero-num">
        <span class="hero-num-value">${fmtKRWFull(k.net_worth_krw)}</span>
      </div>
      <div style="display:flex; gap: var(--s3); flex-wrap: wrap; align-items: baseline;">
        ${k.mom_pct != null ? `<span class="hero-num-delta ${deltaClass(k.mom_pct)}">MoM ${fmtPct(k.mom_pct)}</span>` : ''}
        ${k.yoy_pct != null ? `<span class="hero-num-delta ${deltaClass(k.yoy_pct)}">YoY ${fmtPct(k.yoy_pct)}</span>` : ''}
      </div>
      ${rows.length > 0 ? `
        <details class="wealth-expand card-interactive">
          <summary>
            자산군별 상세
            <span class="chev">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </span>
          </summary>
          <div class="breakdown-grid">${rowsHtml}</div>
        </details>` : ''}
    `;
  }

  function renderExpense(data) {
    const k = data.kpi || {};
    const cats = k.top_categories || [];
    const catsHtml = cats.map(c => `
      <span class="cat-chip">
        ${escapeHtml(c.name)}
        <span class="pct">${fmtPctNoSign(c.weight_pct)}</span>
      </span>
    `).join('');

    return `
      <div class="hero-num">
        <span class="hero-num-value">${fmtKRWFull(k.last_month_total_krw)}</span>
        <span class="hero-num-unit">전달</span>
      </div>
      <div>
        ${k.mom_pct != null ? `<span class="hero-num-delta ${deltaClass(k.mom_pct)}">전전달 대비 ${fmtPct(k.mom_pct)}</span>` : ''}
      </div>
      ${cats.length > 0 ? `<div class="cat-chips">${catsHtml}</div>` : ''}
    `;
  }

  function renderHealth(data) {
    const k = data.kpi || {};
    const members = k.members || [];
    const statusLabel = { ok: '양호', warn: '주의', bad: '경고' };
    const html = members.map(m => `
      <div class="health-row">
        <span class="dot dot-${escapeHtml(m.status || 'unknown')}"></span>
        <span class="health-name">${escapeHtml(m.name || m.id)}</span>
        <span class="health-status">${escapeHtml(statusLabel[m.status] || '—')}</span>
      </div>
    `).join('');
    return `<div class="health-list">${html}</div>`;
  }

  function renderFuture(data) {
    const k = data.kpi || {};
    const yrs = k.years_to_retirement;
    const ms = k.next_milestone;
    const msDate = k.next_milestone_date;

    // Session 5.1 — 진행률 결합 계산:
    //   백엔드가 직접 goal_progress_pct를 주면 그대로 사용,
    //   null이면 Wealth.retirement_value_krw / Future.retirement_target_krw 로 계산.
    let prog = k.goal_progress_pct;
    let progSub = null;  // 막대 아래 보조 텍스트: "₩2.6억 / ₩15억"
    if (prog == null) {
      const wealth = state.data.wealth;
      if (wealth && wealth.kpi) {
        const value  = Number(wealth.kpi.retirement_value_krw) || 0;
        const target = Number(k.retirement_target_krw) || 0;
        if (target > 0 && value > 0) {
          prog = Math.min(100, (value / target) * 100);
          progSub = '₩' + fmtEokShort(value) + ' / ₩' + fmtEokShort(target);
        }
      }
    }

    return `
      <div class="hero-num">
        <span class="hero-num-value">${yrs != null ? yrs.toFixed(1) : '—'}</span>
        <span class="hero-num-unit">년 남음</span>
      </div>
      <div style="font-size: 11px; color: var(--text-quiet);">은퇴까지</div>
      ${prog != null ? `
        <div class="progress-track">
          <div class="progress-fill" style="width: ${Math.min(100, Math.max(0, prog))}%"></div>
        </div>
        <div class="progress-label">
          <span>${progSub ? escapeHtml(progSub) : '목표 달성률'}</span>
          <span>${fmtPctNoSign(prog)}</span>
        </div>` : ''}
      ${ms ? `
        <div class="milestone">
          <div class="milestone-label">다음 마일스톤</div>
          <div>
            <span class="milestone-text">${escapeHtml(ms)}</span>
            ${msDate ? `<span class="milestone-date">${escapeHtml(msDate)}</span>` : ''}
          </div>
        </div>` : ''}
    `;
  }

  /* 큰 금액을 짧게: 263118200 → "2.6억", 1500000000 → "15억" */
  function fmtEokShort(n) {
    if (n == null || n === 0) return '0';
    const eok = n / 100000000;
    if (eok >= 1) {
      const v = Math.round(eok * 10) / 10;
      return v.toString().replace(/\.0$/, '') + '억';
    }
    const cm = n / 10000000;  // 천만
    if (cm >= 1) return Math.round(cm) + '천만';
    return Number(n).toLocaleString('ko-KR');
  }

  function renderTravel(data) {
    const k = data.kpi || {};
    const trips = Array.isArray(k.upcoming_trips) ? k.upcoming_trips : [];
    const total = k.upcoming_count || trips.length;

    // 4슬롯 채우기. 부족하면 빈 슬롯 (점선 + "여행 추가 +")
    const slots = [];
    for (let i = 0; i < 4; i++) {
      const t = trips[i];
      if (t) {
        const sub = t.period_start
          ? t.period_start
          : (t.country_code || '');
        slots.push(`
          <div class="travel-slot">
            <div>
              <div class="city">${escapeHtml(t.city || t.display_name || '—')}</div>
              ${sub ? `<div class="sub">${escapeHtml(sub)}</div>` : ''}
            </div>
            <span class="planned">${t.planned_count || 0}곳</span>
          </div>
        `);
      } else {
        slots.push(`<div class="travel-slot empty">+ 여행 추가</div>`);
      }
    }

    const meta = total > 4
      ? '향후 ' + total + '개 · 가까운 시작일 순 4개 표시'
      : (total > 0 ? '향후 ' + total + '개' : '아직 계획 없음');

    return `
      <div class="travel-grid">
        ${slots.join('')}
      </div>
      <div class="travel-meta">${escapeHtml(meta)}</div>
    `;
  }

  /* ─── Tasks 통합 ────────────────────────────────────── */
  function renderTasks() {
    const ul = document.getElementById('tasks-list');
    const empty = document.getElementById('task-empty');
    const countEl = document.getElementById('task-count');

    const all = [];
    for (const d of DASHBOARDS) {
      const data = state.data[d.id];
      if (data && Array.isArray(data.tasks)) {
        data.tasks.forEach(t => all.push({ ...t, _dash: d }));
      }
    }
    const order = { bad: 0, warn: 1, info: 2 };
    all.sort((a, b) => (order[a.urgency] ?? 9) - (order[b.urgency] ?? 9));

    countEl.textContent = all.length > 0 ? all.length + '건' : '';

    if (all.length === 0) {
      ul.innerHTML = '';
      ul.style.display = 'none';
      empty.style.display = 'block';
      return;
    }

    ul.style.display = '';
    empty.style.display = 'none';
    ul.innerHTML = all.map(t => `
      <li class="task-item" data-href="${escapeHtml(t._dash.href)}">
        <span class="task-urgency u-${escapeHtml(t.urgency || 'info')}"></span>
        <span class="task-text">${escapeHtml(t.label || '')}</span>
        ${t.due ? `<span class="task-due">${escapeHtml(t.due)}</span>` : ''}
        <span class="task-tag">${escapeHtml(t._dash.label)}</span>
      </li>
    `).join('');

    ul.querySelectorAll('.task-item').forEach(li => {
      li.addEventListener('click', () => {
        const href = li.dataset.href;
        if (href) window.open(href, '_blank', 'noopener');
      });
    });
  }

  /* ─── 카드 내부 빈상태 버튼 위임 ──────────────────── */
  document.getElementById('cards').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-fos-action]');
    if (!btn) return;
    e.preventDefault();
    e.stopPropagation();
    const action = btn.dataset.fosAction;
    if (action === 'open-settings') {
      document.getElementById('fos-btn-settings').click();
    } else if (action === 'retry') {
      const id = btn.dataset.id;
      if (id) refreshOne(id);
    }
  });

  /* ─── 카드 전체 클릭 → 새 탭에서 서브 대시보드 열기 (Session 5.3) ─── */
  document.getElementById('cards').addEventListener('click', (e) => {
    // 내부 인터랙티브 요소 클릭이면 무시 (button/summary/a/input/textarea/label)
    if (e.target.closest('button, summary, a, input, textarea, label')) return;
    const card = e.target.closest('.card');
    if (!card) return;
    const overlay = card.querySelector('a.card-link-overlay');
    if (!overlay) return;
    const href = overlay.getAttribute('href');
    if (!href) return;
    window.open(href, '_blank', 'noopener');
  });

  /* ─── 부팅 ───────────────────────────────────────────── */
  DASHBOARDS.forEach(d => renderCard(d.id));
  refreshAll();
  FamilyOS.registerServiceWorker();

  /* ═══════════════════════════════════════════════════════
   * Session 5.1 — LocalStorage 영속성 자동 진단 + 백업
   * ─────────────────────────────────────────────────────
   * 컴퓨터를 껐다 켜면 URL이 다 사라지는 환경 대응.
   * 흔한 원인:
   *   - Chrome 사이트 설정에서 "쿠키 및 사이트 데이터 닫을 때 삭제"
   *   - 시스템 종료 시 자동 정리 (백신/시스템 클리너)
   *   - Chrome 113+ Tracking Protection (특정 케이스)
   * ═══════════════════════════════════════════════════════ */
  (function storageDiag() {
    const PREFIX = 'familyOS.webAppUrl.';
    const COUNT_KEY = 'familyOS.diag.lastUrlCount';
    const TS_KEY = 'familyOS.diag.lastLoadTs';
    const ids = DASHBOARDS.map(d => d.id);

    // 현재 저장된 URL 개수
    const saved = {};
    let nowCount = 0;
    ids.forEach(id => {
      const v = localStorage.getItem(PREFIX + id);
      saved[id] = !!v;
      if (v) nowCount++;
    });

    // 이전 로드 시점 비교
    const prevCount = parseInt(localStorage.getItem(COUNT_KEY) || '-1', 10);
    const prevTsStr = localStorage.getItem(TS_KEY);
    const prevTs = prevTsStr ? parseInt(prevTsStr, 10) : null;
    const now = Date.now();

    // 콘솔 진단
    console.log('%c[Family OS] Storage 진단', 'color:#E5C158;font-weight:600');
    console.log('  현재 저장된 URL:', saved, '(' + nowCount + '/' + ids.length + ')');
    if (prevCount >= 0 && prevTs) {
      const minsAgo = Math.round((now - prevTs) / 60000);
      console.log('  이전 로드: ' + prevCount + '개 URL · ' + minsAgo + '분 전');
    } else {
      console.log('  이전 로드 기록 없음 (첫 방문 또는 storage가 영속화 안 됨)');
    }

    // 영속화 실패 감지: 이전 로드에선 URL이 있었는데 이번엔 0개
    const persistenceFailed = (prevCount > 0 && nowCount === 0);
    if (persistenceFailed) {
      console.warn('  ⚠ LocalStorage 영속화 실패. 이전엔 ' + prevCount + '개였는데 모두 사라짐');
      showStorageWarningBanner(prevCount);
    }

    // 이번 로드 상태 기록
    try {
      localStorage.setItem(COUNT_KEY, String(nowCount));
      localStorage.setItem(TS_KEY, String(now));
    } catch (e) {
      console.error('  ⚠ LocalStorage 쓰기 실패:', e.message);
      showStorageBlockedBanner();
    }
  })();

  function showStorageWarningBanner(prevCount) {
    const banner = document.createElement('div');
    banner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;'
      + 'background:#7c2d12;color:#fef3c7;padding:12px 16px;'
      + 'font-size:13px;line-height:1.5;display:flex;gap:12px;align-items:center;'
      + 'box-shadow:0 2px 12px rgba(0,0,0,0.4);font-family:var(--font-body);';
    banner.innerHTML =
      '<div style="flex:1;">'
      + '<strong>⚠ 저장된 Web App URL이 사라졌어요.</strong> '
      + '이전 방문에서 ' + prevCount + '개를 저장했는데 모두 비어있습니다. '
      + 'Chrome 설정 또는 시스템 클리너가 사이트 데이터를 자동 삭제 중일 수 있어요. '
      + '<a href="#" id="fos-diag-help" style="color:#fef3c7;text-decoration:underline;">대처 방법</a>'
      + '</div>'
      + '<button id="fos-diag-close" style="background:transparent;border:1px solid #fef3c7;'
      + 'color:#fef3c7;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px;">닫기</button>';
    document.body.insertBefore(banner, document.body.firstChild);
    document.getElementById('fos-diag-close').onclick = () => banner.remove();
    document.getElementById('fos-diag-help').onclick = (e) => {
      e.preventDefault();
      alert(
        '저장 영속화 실패 원인 (가능성 순):\n\n'
        + '1. Chrome 설정 확인\n'
        + '   chrome://settings/cookies\n'
        + '   → "닫을 때 쿠키와 사이트 데이터 삭제"가 켜져 있다면 끄기\n'
        + '   → 또는 travelerphs-del.github.io를 예외 사이트로 추가\n\n'
        + '2. 사이트 데이터 차단 확인\n'
        + '   chrome://settings/content/cookies\n'
        + '   → "데이터 저장 불가" 목록에 이 사이트가 있는지\n\n'
        + '3. 시스템 클리너/백신 확인\n'
        + '   CCleaner, Norton 등이 브라우저 데이터를 종료 시 정리하는지\n\n'
        + '4. 임시 해결: 설정 모달에서 "백업 코드" 복사 후\n'
        + '   사라질 때마다 붙여넣기로 복구'
      );
    };
  }

  function showStorageBlockedBanner() {
    const banner = document.createElement('div');
    banner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;'
      + 'background:#7f1d1d;color:#fee2e2;padding:12px 16px;'
      + 'font-size:13px;line-height:1.5;font-family:var(--font-body);';
    banner.textContent = '⚠ 이 브라우저에서 LocalStorage 쓰기가 차단됨. '
      + 'Chrome 시크릿 모드이거나 사이트 데이터가 차단된 상태입니다.';
    document.body.insertBefore(banner, document.body.firstChild);
  }

  /* ─── 모달에 백업/복원 기능 추가 ──────────────────────
   * common.js의 모달은 그대로 두고, 모달이 열릴 때 추가 영역을 동적으로 삽입.
   */
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('#fos-btn-settings');
    if (!btn) return;
    setTimeout(injectBackupUI, 50);  // 모달 열린 후
  });

  function injectBackupUI() {
    const modal = document.querySelector('.modal-backdrop.open .modal');
    if (!modal) return;
    if (modal.querySelector('#fos-backup-block')) return;  // 이미 있으면 skip

    // URL 입력 필드들 다음, 액션 버튼들 앞에 끼워넣기
    const actions = modal.querySelector('.modal-actions');
    if (!actions) return;

    const block = document.createElement('div');
    block.id = 'fos-backup-block';
    block.style.cssText = 'margin-top: var(--s5); padding-top: var(--s4); '
      + 'border-top: 1px dashed var(--border);';
    block.innerHTML = `
      <div style="font-size:11px;color:var(--text-secondary);
                  text-transform:uppercase;letter-spacing:0.06em;margin-bottom:var(--s2);">
        백업 / 복원
      </div>
      <div style="font-size:11px;color:var(--text-quiet);line-height:1.6;margin-bottom:var(--s3);">
        4개 URL을 한 줄로 묶어 백업합니다. URL이 사라졌을 때 붙여넣고
        <strong style="color:var(--text-secondary);">복원</strong> 버튼을 누르면 즉시 복구됩니다.
      </div>
      <textarea id="fos-backup-text" class="modal-input"
        style="width:100%;height:72px;resize:vertical;font-size:10px;line-height:1.4;"
        placeholder="여기에 백업 코드가 자동으로 채워집니다. 다른 곳(메모장/메일)에 복사해 두세요."></textarea>
      <div style="display:flex;gap:var(--s2);margin-top:var(--s2);">
        <button type="button" class="btn btn-ghost" id="fos-backup-copy"
          style="font-size:11px;padding:6px 12px;">복사</button>
        <button type="button" class="btn btn-ghost" id="fos-backup-restore"
          style="font-size:11px;padding:6px 12px;">복원</button>
      </div>
    `;
    actions.parentNode.insertBefore(block, actions);

    // 백업 코드 자동 생성 (현재 입력 필드 값들 우선, 없으면 LocalStorage)
    const backup = {};
    DASHBOARDS.forEach(d => {
      const input = modal.querySelector('#fos-url-' + d.id);
      const v = (input && input.value.trim()) || FamilyOS.getWebAppUrl(d.id);
      if (v) backup[d.id] = v;
    });
    const text = modal.querySelector('#fos-backup-text');
    text.value = btoa(unescape(encodeURIComponent(JSON.stringify(backup))));

    modal.querySelector('#fos-backup-copy').onclick = async () => {
      try {
        await navigator.clipboard.writeText(text.value);
        const btn = modal.querySelector('#fos-backup-copy');
        const orig = btn.textContent;
        btn.textContent = '복사됨 ✓';
        setTimeout(() => { btn.textContent = orig; }, 1500);
      } catch (e) {
        text.select();
        document.execCommand('copy');
      }
    };

    modal.querySelector('#fos-backup-restore').onclick = () => {
      const raw = text.value.trim();
      if (!raw) {
        alert('백업 코드를 먼저 붙여넣으세요.');
        return;
      }
      try {
        const decoded = JSON.parse(decodeURIComponent(escape(atob(raw))));
        let restored = 0;
        DASHBOARDS.forEach(d => {
          if (decoded[d.id]) {
            const input = modal.querySelector('#fos-url-' + d.id);
            if (input) {
              input.value = decoded[d.id];
              restored++;
            }
          }
        });
        alert(restored + '개 URL이 입력란에 복원되었습니다. "저장" 버튼을 눌러 적용하세요.');
      } catch (e) {
        alert('백업 코드 형식이 올바르지 않습니다.\n' + e.message);
      }
    };
  }
  </script>
</body>
</html>
